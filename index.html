<!DOCTYPE html>
<html lang="en-GB" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>spatialetwo</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        black: '#000000',
                        white: '#ffffff',
                        verifyYellow: '#FFD700'
                    }
                }
            }
        }
    </script>
    <!-- Logo Favicon matching two circles with transparent background -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='transparent'/%3E%3Ccircle cx='205' cy='256' r='85' fill='white'/%3E%3Ccircle cx='335' cy='256' r='55' fill='white'/%3E%3C/svg%3E">
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent !important;
            user-select: none;
        }

        /* Disable blue tap highlights across mobile webviews and browsers */
        a, button, input, textarea, select, div, label, svg {
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
        }

        /* Minimal Sleek Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.95);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        /* Custom Dragbar Range Input Styling */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.25);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .glass-header {
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
        }

        /* Desktop vs Mobile Typography & Responsive Utilities */
        @media (min-width: 1024px) {
            .app-title { font-size: 1.5rem; }
            .post-text { font-size: 1.125rem; }
            .username-text { font-size: 1.1rem; }
            .header-icon { width: 1.85rem; height: 1.85rem; }
        }
        @media (max-width: 767px) {
            .app-title { font-size: 1.15rem; }
            .post-text { font-size: 0.925rem; }
            .username-text { font-size: 0.925rem; }
            .header-icon { width: 1.4rem; height: 1.4rem; }
        }
    </style>
</head>
<body class="bg-black text-white antialiased selection:bg-white selection:text-black min-h-screen">

    <div id="app" class="min-h-screen flex flex-col items-center justify-between">
        <!-- Main Application Viewport -->
        <main id="main-content" class="w-full max-w-xl min-h-screen flex flex-col pb-24 sm:pb-0">
            <!-- Loading splash screen -->
            <div id="splash-screen" class="flex flex-col items-center justify-center min-h-screen p-6 space-y-8">
                <svg class="w-24 h-24 animate-pulse" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="205" cy="256" r="85" fill="white"/>
                    <circle cx="335" cy="256" r="55" fill="white"/>
                </svg>
                <p class="text-xs sm:text-sm font-bold tracking-widest uppercase text-white/50">your space to connect</p>
            </div>
        </main>
    </div>

    <!-- System Modal Dialog -->
    <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-xl hidden p-6">
        <div class="glass-panel text-white p-8 rounded-3xl max-w-sm w-full text-center space-y-6">
            <svg class="w-12 h-12 mx-auto" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="205" cy="256" r="85" fill="white"/>
                <circle cx="335" cy="256" r="55" fill="white"/>
            </svg>
            <p id="modal-message" class="text-xs sm:text-sm font-medium text-white/90 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full py-4 bg-white text-black text-xs sm:text-sm font-bold rounded-full active:scale-95">dismiss</button>
        </div>
    </div>

    <!-- Edit Post Modal -->
    <div id="edit-post-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-xl hidden p-6">
        <div class="glass-panel text-white p-6 rounded-3xl max-w-md w-full space-y-4">
            <h3 class="text-sm font-bold text-white">edit publication</h3>
            <textarea id="edit-post-caption" rows="4" class="w-full p-4 glass-panel rounded-2xl text-xs sm:text-sm text-white focus:outline-none resize-none"></textarea>
            <div class="flex space-x-3">
                <button onclick="savePostEdit()" class="flex-1 py-3 bg-white text-black font-bold text-xs sm:text-sm rounded-full active:scale-95">save</button>
                <button onclick="closeEditModal()" class="flex-1 py-3 glass-panel text-white font-bold text-xs sm:text-sm rounded-full active:scale-95">cancel</button>
            </div>
        </div>
    </div>

    <!-- Live Camera Modal -->
    <div id="camera-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black hidden p-6">
        <div class="w-full max-w-md flex flex-col items-center space-y-6">
            <div class="relative w-full aspect-square rounded-3xl overflow-hidden glass-panel">
                <video id="camera-stream" autoplay playsinline class="w-full h-full object-cover"></video>
            </div>
            <div class="flex space-x-4 w-full">
                <button onclick="capturePhoto()" class="flex-1 py-4 bg-white text-black font-semibold text-xs sm:text-sm rounded-full active:scale-95">capture</button>
                <button onclick="closeCamera()" class="flex-1 py-4 glass-panel text-white font-semibold text-xs sm:text-sm rounded-full active:scale-95">cancel</button>
            </div>
        </div>
        <canvas id="snapshot-canvas" class="hidden"></canvas>
    </div>

    <!-- Followers / Following Modal -->
    <div id="user-list-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-xl hidden p-6">
        <div class="glass-panel text-white p-6 rounded-3xl max-w-md w-full space-y-4 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center pb-2 border-b border-white/10">
                <h3 id="user-list-title" class="text-sm font-bold text-white">users</h3>
                <button onclick="closeUserListModal()" class="p-2 text-white/60 text-sm">✕</button>
            </div>
            <div id="user-list-content" class="flex-1 overflow-y-auto space-y-3 pt-2"></div>
        </div>
    </div>

    <!-- Detailed Video Call Modal (DM / Group Call simulation) -->
    <div id="video-call-modal" class="fixed inset-0 z-50 bg-black flex flex-col justify-between hidden p-4 sm:p-8">
        <div class="flex justify-between items-center z-10 glass-panel px-6 py-4 rounded-3xl">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-red-500 rounded-full animate-ping"></div>
                <span id="video-call-title" class="text-xs sm:text-sm font-bold">secure video transmission</span>
            </div>
            <span id="video-call-timer" class="text-xs font-mono text-white/70">00:00</span>
        </div>

        <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 my-4 relative">
            <div class="w-full h-full rounded-3xl overflow-hidden glass-panel relative flex items-center justify-center">
                <video id="call-remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
                <div class="absolute bottom-4 left-4 glass-panel px-3 py-1.5 rounded-full text-[10px] font-bold">remote feed</div>
            </div>
            <div class="w-full h-full rounded-3xl overflow-hidden glass-panel relative flex items-center justify-center">
                <video id="call-local-video" autoplay muted playsinline class="w-full h-full object-cover"></video>
                <div class="absolute bottom-4 left-4 glass-panel px-3 py-1.5 rounded-full text-[10px] font-bold">you</div>
            </div>
        </div>

        <div class="flex justify-center items-center space-x-6 z-10 pb-4">
            <button onclick="toggleCallMute()" id="call-mute-btn" class="p-4 rounded-full glass-panel active:scale-95 text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            </button>
            <button onclick="endVideoCall()" class="px-8 py-4 bg-red-600 text-white font-bold text-xs sm:text-sm rounded-full active:scale-95 shadow-lg shadow-red-600/30">
                end call
            </button>
            <button onclick="toggleCallVideo()" id="call-video-btn" class="p-4 rounded-full glass-panel active:scale-95 text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            </button>
        </div>
    </div>

    <!-- Create Group Modal -->
    <div id="create-group-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-xl hidden p-6">
        <div class="glass-panel text-white p-6 rounded-3xl max-w-md w-full space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center pb-2 border-b border-white/10">
                <h3 class="text-sm font-bold text-white">create secure group</h3>
                <button onclick="closeCreateGroupModal()" class="p-2 text-white/60 text-sm">✕</button>
            </div>
            
            <div class="space-y-4 flex-1 overflow-y-auto pr-1">
                <input type="text" id="group-name-input" placeholder="group frequency name..." 
                    class="w-full px-5 py-3.5 glass-panel rounded-full text-white placeholder-white/30 text-xs sm:text-sm focus:outline-none">
                
                <div class="flex items-center space-x-3 p-2">
                    <div id="group-avatar-preview" class="w-12 h-12 rounded-full glass-panel flex items-center justify-center overflow-hidden flex-shrink-0">
                        <svg class="w-5 h-5 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    </div>
                    <label class="flex-1 text-xs font-semibold text-white/80 glass-panel py-3.5 rounded-full text-center cursor-pointer active:scale-95">
                        upload group pfp
                        <input type="file" accept="image/*" onchange="handleGroupAvatarUpload(event)" class="hidden">
                    </label>
                </div>

                <div class="space-y-2">
                    <span class="text-[10px] font-bold text-white/50 uppercase tracking-widest">select members</span>
                    <div id="group-member-selection-list" class="space-y-2 max-h-40 overflow-y-auto"></div>
                </div>
            </div>

            <button onclick="confirmCreateGroup()" class="w-full py-3.5 bg-white text-black font-bold text-xs sm:text-sm rounded-full active:scale-95">create group</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'spatialetwo-app';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : JSON.stringify({
            apiKey: "AIzaSyBGpqz8AiNyMg4SHu1ljRd_INI9YAiSsIo",
            authDomain: "spatialetwo.firebaseapp.com",
            projectId: "spatialetwo",
            storageBucket: "spatialetwo.firebasestorage.app",
            messagingSenderId: "194895362000",
            appId: "1:194895362000:web:b2dc1ab1650fa2635aebd5",
            measurementId: "G-7F55107941"
        }));

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let userProfile = null;
        let mediaStream = null;
        let activeTab = 'feed';
        let viewProfileUid = null;
        let activeEditingPostId = null;
        let activeDmUid = null;
        let activeGroupId = null;
        let callTimerInterval = null;
        let callSeconds = 0;
        let callStream = null;

        // System Dialog Handler
        window.showModal = function(msg) {
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('custom-modal').classList.remove('hidden');
        }
        window.closeModal = function() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        // Check 100+ followers for verification tick
        function isVerified(profile) {
            return profile && profile.followers && profile.followers.length >= 100;
        }

        function getVerifyBadge(profile) {
            if (isVerified(profile)) {
                return `<span class="inline-flex items-center justify-center w-4 h-4 ml-1.5 bg-verifyYellow text-black font-black text-[9px] rounded-full" title="Verified Creator (100+ Followers)">✓</span>`;
            }
            return '';
        }

        // Android & iOS Device Notification Request & Dispatch
        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission().catch(() => {});
            }
        }

        function sendDeviceNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    const options = {
                        body: body,
                        icon: 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 512 512\'%3E%3Ccircle cx=\'205\' cy=\'256\' r=\'85\' fill=\'white\'/%3E%3Ccircle cx=\'335\' cy=\'256\' r=\'55\' fill=\'white\'/%3E%3C/svg%3E',
                        badge: 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 512 512\'%3E%3Ccircle cx=\'205\' cy=\'256\' r=\'85\' fill=\'white\'/%3E%3C/svg%3E',
                        vibrate: [200, 100, 200]
                    };
                    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                        navigator.serviceWorker.ready.then(registration => {
                            registration.showNotification(title, options);
                        });
                    } else {
                        new Notification(title, options);
                    }
                } catch(e) { console.error("Notification dispatch error:", e); }
            }
        }

        // Local Storage persistent session state
        function getStoredAccounts() {
            try {
                return JSON.parse(localStorage.getItem('spatialetwo_local_accounts') || '{}');
            } catch(e) {
                return {};
            }
        }

        function saveLocalAccount(userData) {
            const accs = getStoredAccounts();
            accs[userData.username.toLowerCase()] = userData;
            localStorage.setItem('spatialetwo_local_accounts', JSON.stringify(accs));
            localStorage.setItem('spatialetwo_logged_username', userData.username.toLowerCase());
        }

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth init catch:", err);
                try { await signInAnonymously(auth); } catch(e) {}
            }

            onAuthStateChanged(auth, async (user) => {
                currentUser = user;
                requestNotificationPermission();
                await restoreUserSession();
            });
        }

        async function restoreUserSession() {
            const savedUsername = localStorage.getItem('spatialetwo_logged_username');
            if (savedUsername) {
                let found = await loadProfileByUsername(savedUsername);
                if (!found) {
                    const localAccs = getStoredAccounts();
                    if (localAccs[savedUsername]) {
                        userProfile = localAccs[savedUsername];
                        found = true;
                    }
                }
                if (found && userProfile) {
                    renderMainApp();
                    return;
                }
            }

            if (currentUser) {
                try {
                    const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.uid);
                    const userSnap = await getDoc(userDocRef);
                    if (userSnap.exists()) {
                        userProfile = userSnap.data();
                        saveLocalAccount(userProfile);
                        renderMainApp();
                        return;
                    }
                } catch (e) {
                    console.error("Session UID load error:", e);
                }
            }

            renderAuthScreen();
        }

        async function loadProfileByUsername(username) {
            try {
                const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
                let matched = null;
                usersSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data && data.username && data.username.toLowerCase() === username.toLowerCase()) {
                        matched = data;
                    }
                });
                if (matched) {
                    userProfile = matched;
                    return true;
                }
            } catch(e) {
                console.error("Profile load error:", e);
            }
            return false;
        }

        function renderAuthScreen() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen p-6 space-y-8 animate-fadeIn">
                    <div class="flex flex-col items-center space-y-4 text-center">
                        <svg class="w-20 h-20 sm:w-24 sm:h-24" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="205" cy="256" r="85" fill="white"/>
                            <circle cx="335" cy="256" r="55" fill="white"/>
                        </svg>
                        <h1 class="text-3xl sm:text-4xl font-black tracking-tighter">spatialetwo</h1>
                        <p class="text-xs sm:text-sm text-white/50 tracking-widest uppercase">your space to connect</p>
                    </div>

                    <div class="w-full max-w-sm space-y-6">
                        <div class="flex glass-panel p-1 rounded-full">
                            <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-3 text-xs sm:text-sm font-bold rounded-full bg-white text-black">login</button>
                            <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-3 text-xs sm:text-sm font-bold rounded-full text-white/70">create account</button>
                        </div>

                        <div id="auth-form-container" class="space-y-4"></div>
                    </div>
                </div>
            `;
            switchAuthTab('login');
        }

        window.switchAuthTab = function(mode) {
            const container = document.getElementById('auth-form-container');
            const loginBtn = document.getElementById('tab-login');
            const signupBtn = document.getElementById('tab-signup');

            if (mode === 'login') {
                loginBtn.className = "flex-1 py-3 text-xs sm:text-sm font-bold rounded-full bg-white text-black";
                signupBtn.className = "flex-1 py-3 text-xs sm:text-sm font-bold rounded-full text-white/70";
                container.innerHTML = `
                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <input type="text" id="login-username" placeholder="username" required 
                            class="w-full px-5 py-4 glass-panel rounded-full text-white placeholder-white/30 text-xs sm:text-sm focus:outline-none">
                        <input type="password" id="login-password" placeholder="password" required 
                            class="w-full px-5 py-4 glass-panel rounded-full text-white placeholder-white/30 text-xs sm:text-sm focus:outline-none">
                        <button type="submit" class="w-full py-4 bg-white text-black font-bold text-xs sm:text-sm rounded-full active:scale-95">enter</button>
                    </form>
                `;
            } else {
                signupBtn.className = "flex-1 py-3 text-xs sm:text-sm font-bold rounded-full bg-white text-black";
                loginBtn.className = "flex-1 py-3 text-xs sm:text-sm font-bold rounded-full text-white/70";
                container.innerHTML = `
                    <form onsubmit="handleSignup(event)" class="space-y-4">
                        <input type="text" id="su-name" placeholder="full name" required 
                            class="w-full px-5 py-4 glass-panel rounded-full text-white placeholder-white/30 text-xs sm:text-sm focus:outline-none">
                        <input type="text" id="su-username" placeholder="username (unique)" required 
                            class="w-full px-5 py-4 glass-panel rounded-full text-white placeholder-white/30 text-xs sm:text-sm focus:outline-none">
                        <input type="password" id="su-password" placeholder="password" required 
                            class="w-full px-5 py-4 glass-panel rounded-full text-white placeholder-white/30 text-xs sm:text-sm focus:outline-none">
                        
                        <!-- Age Selection -->
                        <div class="glass-panel p-5 rounded-3xl space-y-3">
                            <div class="flex justify-between text-xs font-semibold text-white/70">
                                <span>age</span>
                                <span id="age-display" class="text-white font-bold">22 yrs</span>
                            </div>
                            <input type="range" id="su-age-slider" min="14" max="90" value="22" oninput="updateAgeDisplay(this.value)">
                        </div>

                        <!-- Gender Spectrum Selection -->
                        <div class="glass-panel p-5 rounded-3xl space-y-3">
                            <div class="flex justify-between text-xs font-semibold text-white/70">
                                <span>gender orientation</span>
                                <span id="gender-display" class="text-white font-bold">non-binary</span>
                            </div>
                            <input type="range" id="su-gender-slider" min="0" max="3" value="0" step="1" oninput="updateGenderDisplay(this.value)">
                        </div>

                        <textarea id="su-bio" placeholder="short bio..." rows="2"

        let pendingAvatarBase64 = null;
        window.handleAvatarUpload = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    pendingAvatarBase64 = e.target.result;
                    const preview = document.getElementById('avatar-preview');
                    if (preview) preview.innerHTML = `<img src="${pendingAvatarBase64}" class="w-full h-full object-cover">`;
                };
                reader.readAsDataURL(file);
            }
        }

        window.openCameraModal = function() {
            const modal = document.getElementById('camera-modal');
            modal.classList.remove('hidden');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                .then(stream => {
                    mediaStream = stream;
                    document.getElementById('camera-stream').srcObject = stream;
                })
                .catch(() => {
                    showModal("Camera access unavailable.");
                    modal.classList.add('hidden');
                });
        }

        window.closeCamera = function() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('camera-modal').classList.add('hidden');
        }

        window.capturePhoto = function() {
            const video = document.getElementById('camera-stream');
            const canvas = document.getElementById('snapshot-canvas');
            canvas.width = video.videoWidth || 300;
            canvas.height = video.videoHeight || 300;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            pendingAvatarBase64 = canvas.toDataURL('image/png');
            const preview = document.getElementById('avatar-preview');
            if (preview) preview.innerHTML = `<img src="${pendingAvatarBase64}" class="w-full h-full object-cover">`;
            closeCamera();
        }

        window.handleSignup = async function(event) {
            event.preventDefault();
            const name = document.getElementById('su-name').value.trim();
            const username = document.getElementById('su-username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
            const password = document.getElementById('su-password').value;
            const age = parseInt(document.getElementById('su-age-slider').value, 10);
            const genderIndex = document.getElementById('su-gender-slider').value;
            const gender = GENDER_MAP[genderIndex];
            const bio = document.getElementById('su-bio').value.trim();
            const termsChecked = document.getElementById('terms-check').checked;

            if (age < 14) {
                showModal("Users below 14 years of age are not permitted.");
                return;
            }

            if (!termsChecked) {
                showModal("Please agree to the age requirement and content guidelines.");
                return;
            }

            if (!username) {
                showModal("Please enter a valid username.");
                return;
            }

            let activeUid = currentUser ? currentUser.uid : 'usr_' + Date.now();
            if (!currentUser) {
                try {
                    const cred = await signInAnonymously(auth);
                    activeUid = cred.user.uid;
                } catch(e) {}
            }

            let usernameTaken = false;
            try {
                const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
                usersSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data && data.username === username) {
                        usernameTaken = true;
                    }
                });
            } catch(e) {}

            if (usernameTaken) {
                showModal(`@${username} is already taken. Please choose another username.`);
                return;
            }

            const newUser = {
                uid: activeUid,
                name,
                username,
                password,
                age,
                gender,
                bio,
                avatar: pendingAvatarBase64 || '',
                banner: '',
                followers: [],
                following: [],
                createdAt: Date.now()
            };

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', activeUid), newUser);
            } catch(e) {
                console.warn("Firestore user sync failed, continuing locally:", e);
            }

            userProfile = newUser;
            saveLocalAccount(newUser);
            renderMainApp();
        }

        window.handleLogin = async function(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            const localAccs = getStoredAccounts();
            if (localAccs[username] && localAccs[username].password === password) {
                userProfile = localAccs[username];
                localStorage.setItem('spatialetwo_logged_username', username);
                renderMainApp();
                return;
            }

            try {
                const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
                let matchedUser = null;
                usersSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.username === username && data.password === password) {
                        matchedUser = data;
                    }
                });

                if (matchedUser) {
                    userProfile = matchedUser;
                    saveLocalAccount(matchedUser);
                    renderMainApp();
                } else {
                    showModal("Invalid username or password.");
                }
            } catch (err) {
                console.error("Login failed:", err);
                showModal("Login failed. Check your network connection.");
            }
        }

        async function fetchMessagesHubData() {
            const groupsRef = collection(db, 'artifacts', appId, 'public', 'data', 'groups');
            onSnapshot(groupsRef, (snap) => {
                const groups = [];
                snap.forEach(d => {
                    const data = d.data();
                    if (data.members && data.members.includes(userProfile.uid)) {
                        groups.push({ id: d.id, ...data });
                    }
                });
                const gList = document.getElementById('groups-hub-list');
                if (!gList) return;
                if (groups.length === 0) {

        function startCallStreams() {
            callSeconds = 0;
            document.getElementById('video-call-timer').innerText = "00:00";
            if (callTimerInterval) clearInterval(callTimerInterval);
            callTimerInterval = setInterval(() => {
                callSeconds++;
                const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
                const secs = String(callSeconds % 60).padStart(2, '0');
                document.getElementById('video-call-timer').innerText = `${mins}:${secs}`;
            }, 1000);

            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then(stream => {
                    callStream = stream;
                    document.getElementById('call-local-video').srcObject = stream;
                    document.getElementById('call-remote-video').srcObject = stream;
                })
                .catch(() => {
                    showModal("Camera/Microphone access required for video call.");
                });
        }

            if (callStream) {
                callStream.getTracks().forEach(t => t.stop());

        window.setPostRatio = function(ratio) {
            composeRatio = ratio;
            ['1-1', '16-9', '4-5'].forEach(r => {
                const btn = document.getElementById(`ratio-btn-${r}`);
                if (btn) {
                    btn.className = (r.replace('-', '/') === ratio) 
                        ? "flex-1 py-2.5 rounded-xl text-xs font-bold bg-white text-black"
                        : "flex-1 py-2.5 rounded-xl text-xs font-bold glass-panel text-white/70";
                }
            });

            const preview = document.getElementById('compose-preview');
            if (preview) {
                preview.style.aspectRatio = ratio === '16/9' ? '16/9' : ratio === '4/5' ? '4/5' : '1/1';
            }
        }

        window.handleComposeKeyDown = function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                publishPost();
            }
        }

        window.handlePostMediaUpload = function(event) {
            const file = event.target.files[0];
            if (file) {
                isVideoMedia = file.type.startsWith('video');
                const reader = new FileReader();
                reader.onload = function(e) {
                    composeMediaBase64 = e.target.result;
                    const preview = document.getElementById('compose-preview');
                    const img = document.getElementById('compose-preview-img');
                    const vid = document.getElementById('compose-preview-vid');

                    if (isVideoMedia) {
                        img.classList.add('hidden');
                        vid.src = composeMediaBase64;
                        vid.classList.remove('hidden');
                    } else {
                        vid.classList.add('hidden');
                        img.src = composeMediaBase64;
                        img.classList.remove('hidden');
                    }
                    if (preview) preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        window.removeComposeMedia = function() {
            composeMediaBase64 = null;
            isVideoMedia = false;
            const preview = document.getElementById('compose-preview');
            if (preview) preview.classList.add('hidden');
        }

        window.publishPost = async function() {
            const caption = document.getElementById('post-caption').value.trim();
            if (!caption && !composeMediaBase64) {
                showModal("Please add text or media to publish.");
                return;
            }

            try {
                const newPost = {
                    authorUid: userProfile.uid,
                    authorUsername: userProfile.username,
                    authorAvatar: userProfile.avatar || '',
                    authorFollowers: userProfile.followers || [],
                    caption,
                    media: composeMediaBase64 || '',
                    isVideo: isVideoMedia,
                    ratio: composeRatio,
                    likes: [],
                    comments: [],
                    createdAt: Date.now()
                };

                await setDoc(doc(collection(db, 'artifacts', appId, 'public', 'data', 'posts')), newPost);
                composeMediaBase64 = null;
                isVideoMedia = false;
                switchTab('feed');
            } catch (e) {
                console.error("Publishing error:", e);
                showModal("Error publishing publication.");
            }
        }

        window.toggleLike = async function(postId, authorUid) {
            const postRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', postId);
            const postSnap = await getDoc(postRef);
            if (!postSnap.exists()) return;
            const data = postSnap.data();
            let likes = data.likes || [];

            if (likes.includes(userProfile.uid)) {
                likes = likes.filter(id => id !== userProfile.uid);
            } else {
                likes.push(userProfile.uid);
                if (authorUid !== userProfile.uid) {
                    await addNotification(authorUid, `@${userProfile.username} liked your publication`);
                    sendDeviceNotification("spatialetwo", `@${userProfile.username} liked your post`);
                }
            }
            await updateDoc(postRef, { likes });
        }

        window.addComment = async function(postId, authorUid) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const postRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', postId);
            const postSnap = await getDoc(postRef);
            if (!postSnap.exists()) return;
            const data = postSnap.data();
            const comments = data.comments || [];

            comments.push({
                uid: userProfile.uid,
                username: userProfile.username,
                text,
                likes: [],
                createdAt: Date.now()
            });

            await updateDoc(postRef, { comments });
            if (authorUid !== userProfile.uid) {
                await addNotification(authorUid, `@${userProfile.username} commented on your publication`);
                sendDeviceNotification("spatialetwo", `@${userProfile.username} commented on your post`);
            }
            input.value = '';
        }

        window.toggleFollow = async function(targetUid) {
            if (targetUid === userProfile.uid) return;
            const targetRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', targetUid);
            const myRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', userProfile.uid);

            const targetSnap = await getDoc(targetRef);
            const mySnap = await getDoc(myRef);
            if (!targetSnap.exists() || !mySnap.exists()) return;

            const targetData = targetSnap.data();
            const myData = mySnap.data();

            let myFollowing = myData.following || [];
            let targetFollowers = targetData.followers || [];

            if (myFollowing.includes(targetUid)) {
                myFollowing = myFollowing.filter(id => id !== targetUid);
                targetFollowers = targetFollowers.filter(id => id !== userProfile.uid);
            } else {
                myFollowing.push(targetUid);
                targetFollowers.push(userProfile.uid);
                
                await addNotification(targetUid, `@${userProfile.username} started following you`);
                sendDeviceNotification("spatialetwo", `@${userProfile.username} started following you`);
            }

            await updateDoc(myRef, { following: myFollowing });
            await updateDoc(targetRef, { followers: targetFollowers });
            
            userProfile.following = myFollowing;
            saveLocalAccount(userProfile);
            renderMainApp();
        }

        window.saveProfileSettings = async function(event) {
            event.preventDefault();
            const newUsername = document.getElementById('edit-username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
            const name = document.getElementById('edit-name').value.trim();
            const bio = document.getElementById('edit-bio').value.trim();

            if (!newUsername) {
                showModal("Please enter a valid username.");
                return;
            }

            if (newUsername !== userProfile.username) {
                let taken = false;
                try {
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
                    snap.forEach(d => {
                        if (d.data().username === newUsername) taken = true;
                    });
                } catch(e) {}
                if (taken) {
                    showModal(`@${newUsername} is already taken.`);
                    return;
                }
            }

            try {
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', userProfile.uid);
                const updates = { username: newUsername, name, bio };
                if (updatedSettingsAvatar) updates.avatar = updatedSettingsAvatar;
                if (updatedSettingsBanner) updates.banner = updatedSettingsBanner;

                await updateDoc(userRef, updates);

                userProfile.username = newUsername;
                userProfile.name = name;
                userProfile.bio = bio;
                if (updatedSettingsAvatar) userProfile.avatar = updatedSettingsAvatar;
                if (updatedSettingsBanner) userProfile.banner = updatedSettingsBanner;

                saveLocalAccount(userProfile);
                showModal("Profile updated successfully.");

                console.error("Save profile error:", e);
                showModal("Saved profile locally.");

                            ${isSelf ? `
                                <div class="flex space-x-2">
                                    <button onclick="openEditModal('${post.id}', \`${post.caption || ''}\`)" class="p-1.5 text-white/60">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                    </button>
                                    <button onclick="deletePost('${post.id}')" class="p-1.5 text-white/60">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                        <p class="text-xs sm:text-sm text-white/90">${formatPostContent(post.caption)}</p>
                        ${post.media ? `
                            <div class="w-full aspect-square rounded-2xl overflow-hidden glass-panel">
                                ${post.isVideo ? `<video src="${post.media}" controls class="w-full h-full object-cover"></video>` : `<img src="${post.media}" class="w-full h-full object-cover">`}
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            });
        }

        window.showFollowersModal = async function(targetUid) {
            const modal = document.getElementById('user-list-modal');
            const title = document.getElementById('user-list-title');
            const content = document.getElementById('user-list-content');
            
            title.innerText = 'followers';
            content.innerHTML = `<div class="text-center py-6 text-white/40 text-xs">loading...</div>`;
            modal.classList.remove('hidden');

            const targetSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', targetUid));
            if (!targetSnap.exists()) return;
            const followerUids = targetSnap.data().followers || [];

            if (followerUids.length === 0) {
                content.innerHTML = `<div class="text-center py-6 text-white/40 text-xs">no followers yet</div>`;
                return;
            }

            const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
            const followersList = [];
            usersSnap.forEach(d => {
                if (followerUids.includes(d.data().uid)) followersList.push(d.data());
            });

            content.innerHTML = followersList.map(u => `
                <div onclick="closeUserListModal(); viewUserProfile('${u.uid}')" class="p-3 rounded-2xl glass-panel flex items-center justify-between cursor-pointer active:scale-98">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full glass-panel overflow-hidden flex items-center justify-center">
                            ${u.avatar ? `<img src="${u.avatar}" class="w-full h-full object-cover">` : `<span class="text-xs font-bold">${u.username[0].toUpperCase()}</span>`}
                        </div>
                        <span class="text-xs font-bold flex items-center">@${u.username} ${getVerifyBadge(u)}</span>
                    </div>
                </div>
            `).join('');
        }

        window.showFollowingModal = async function(targetUid) {
            const modal = document.getElementById('user-list-modal');
            const title = document.getElementById('user-list-title');
            const content = document.getElementById('user-list-content');

            title.innerText = 'following';
            content.innerHTML = `<div class="text-center py-6 text-white/40 text-xs">loading...</div>`;
            modal.classList.remove('hidden');

            const targetSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', targetUid));
            if (!targetSnap.exists()) return;
            const followingUids = targetSnap.data().following || [];

            if (followingUids.length === 0) {
                content.innerHTML = `<div class="text-center py-6 text-white/40 text-xs">not following anyone yet</div>`;
                return;
            }

            const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
            const followingList = [];
            usersSnap.forEach(d => {
                if (followingUids.includes(d.data().uid)) followingList.value = d.data(); // fixed reference
                if (followingUids.includes(d.data().uid)) followingList.push(d.data());
            });

            content.innerHTML = followingList.map(u => `
                <div onclick="closeUserListModal(); viewUserProfile('${u.uid}')" class="p-3 rounded-2xl glass-panel flex items-center justify-between cursor-pointer active:scale-98">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full glass-panel overflow-hidden flex items-center justify-center">
                            ${u.avatar ? `<img src="${u.avatar}" class="w-full h-full object-cover">` : `<span class="text-xs font-bold">${u.username[0].toUpperCase()}</span>`}
                        </div>
                        <span class="text-xs font-bold flex items-center">@${u.username} ${getVerifyBadge(u)}</span>
                    </div>
                </div>
            `).join('');
        }

        window.closeUserListModal = function() {
            document.getElementById('user-list-modal').classList.add('hidden');
        }

        window.onload = function() {
            initAuth();
        }
    </script>
</body>
</html>
