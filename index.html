<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spatialetwo</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        black: '#000000',
                        white: '#ffffff',
                    }
                }
            }
        }
    </script>
    <!-- Exact Logo Favicon matching the two circles precisely with Transparent Background -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='transparent'/%3E%3Ccircle cx='205' cy='256' r='85' fill='white'/%3E%3Ccircle cx='335' cy='256' r='55' fill='white'/%3E%3C/svg%3E">
    
    <style>
        /* Base Pure Pitch Black Theme */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Minimal Sleek Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.9);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* Custom Dragbar Range Input Styling */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
            backdrop-filter: blur(12px);
        }
        input[type=range]::-webkit-slider-thumb {
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -7px;
            box-shadow: 0 0 12px rgba(255,255,255,0.4);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }

        /* Smooth UI Micro-interactions */
        * {
            transition: background-color 0.15s ease, opacity 0.15s ease, transform 0.12s ease;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .glass-header {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        /* Responsive typography scale adjustments */
        @media (min-width: 768px) {
            .app-title { font-size: 1.125rem; }
            .post-text { font-size: 0.875rem; }
            .username-text { font-size: 0.875rem; }
        }
    </style>
</head>
<body class="bg-black text-white antialiased selection:bg-white selection:text-black min-h-screen">

    <div id="app" class="min-h-screen flex flex-col items-center justify-between">
        <!-- Main Application View Port (Maximized for Desktop, Tablet, and Mobile) -->
        <main id="main-content" class="w-full max-w-xl min-h-screen flex flex-col pb-24 sm:pb-0">
            <!-- Loading splash screen -->
            <div id="splash-screen" class="flex flex-col items-center justify-center min-h-screen p-6 space-y-8">
                <!-- Exact Logo representation -->
                <svg class="w-20 h-20 animate-pulse" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="205" cy="256" r="85" fill="white"/>
                    <circle cx="335" cy="256" r="55" fill="white"/>
                </svg>
                <p class="text-xs sm:text-sm font-semibold tracking-widest uppercase text-white/40">spatialetwo</p>
            </div>
        </main>
    </div>

    <!-- Custom System Modal (No browser alert) -->
    <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-lg hidden p-6">
        <div class="glass-panel text-white p-8 rounded-3xl max-w-sm w-full text-center space-y-6">
            <svg class="w-10 h-10 mx-auto" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="205" cy="256" r="85" fill="white"/>
                <circle cx="335" cy="256" r="55" fill="white"/>
            </svg>
            <p id="modal-message" class="text-xs sm:text-sm font-medium text-white/90 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full py-3.5 bg-white text-black text-xs sm:text-sm font-bold rounded-full active:scale-95 transition-transform">dismiss</button>
        </div>
    </div>

    <!-- Live Camera Modal Snapshot Interface -->
    <div id="camera-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black hidden p-6">
        <div class="w-full max-w-md flex flex-col items-center space-y-6">
            <div class="relative w-full aspect-square rounded-3xl overflow-hidden glass-panel">
                <video id="camera-stream" autoplay playsinline class="w-full h-full object-cover"></video>
            </div>
            <div class="flex space-x-4 w-full">
                <button onclick="capturePhoto()" class="flex-1 py-4 bg-white text-black font-semibold text-xs sm:text-sm rounded-full active:scale-95">capture</button>
                <button onclick="closeCamera()" class="flex-1 py-4 glass-panel text-white font-semibold text-xs sm:text-sm rounded-full active:scale-95">cancel</button>
            </div>
        </div>
        <canvas id="snapshot-canvas" class="hidden"></canvas>
    </div>

    <!-- Firebase SDK Imports & Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, getDocs, query, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'spatialetwo-app';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : JSON.stringify({
            apiKey: "AIzaSyBGpqz8AiNyMg4SHu1ljRd_INI9YAiSsIo",
            authDomain: "spatialetwo.firebaseapp.com",
            projectId: "spatialetwo",
            storageBucket: "spatialetwo.firebasestorage.app",
            messagingSenderId: "194895362000",
            appId: "1:194895362000:web:b2dc1ab1650fa2635aebd5",
            measurementId: "G-7F55107941"
        }));

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let userProfile = null;
        let mediaStream = null;
        let activeTab = 'feed';
        let viewProfileUsername = null;

        // Modal triggers
        window.showModal = function(msg) {
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('custom-modal').classList.remove('hidden');
        }
        window.closeModal = function() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        // Device Notifications Setup
        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        function sendDeviceNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    new Notification(title, {
                        body: body,
                        icon: 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 512 512\'%3E%3Ccircle cx=\'205\' cy=\'256\' r=\'85\' fill=\'white\'/%3E%3Ccircle cx=\'335\' cy=\'256\' r=\'55\' fill=\'white\'/%3E%3C/svg%3E'
                    });
                } catch(e) { console.error(e); }
            }
        }

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth initialization error:", err);
                try {
                    await signInAnonymously(auth);
                } catch(e) {
                    console.error("Fallback auth failed:", e);
                }
            }

            onAuthStateChanged(auth, async (user) => {
                currentUser = user;
                if (user) {
                    requestNotificationPermission();
                    await restoreUserSession(user.uid);
                } else {
                    renderAuthScreen();
                }
            });
        }

        async function restoreUserSession(authUid) {
            // Check stored username session
            const savedUsername = localStorage.getItem('spatialetwo_logged_username');
            if (savedUsername) {
                const found = await loadProfileByUsername(savedUsername);
                if (found) {
                    renderMainApp();
                    return;
                }
            }

            // Otherwise check directly via current Auth UID
            try {
                const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', authUid);
                const userSnap = await getDoc(userDocRef);
                if (userSnap.exists()) {
                    userProfile = userSnap.data();
                    localStorage.setItem('spatialetwo_logged_username', userProfile.username);
                    renderMainApp();
                } else {
                    renderAuthScreen();
                }
            } catch (e) {
                console.error("Session load error:", e);
                renderAuthScreen();
            }
        }

        async function loadProfileByUsername(username) {
            try {
                const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
                let matched = null;
                usersSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data && data.username === username.toLowerCase()) {
                        matched = data;
                    }
                });
                if (matched) {
                    userProfile = matched;
                    return true;
                }
            } catch(e) {
                console.error("Profile load failed:", e);
            }
            return false;
        }

        function renderAuthScreen() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen p-6 space-y-8 animate-fadeIn">
                    <div class="flex flex-col items-center space-y-4">
                        <svg class="w-16 h-16 sm:w-20 sm:h-20" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="205" cy="256" r="85" fill="white"/>
                            <circle cx="335" cy="256" r="55" fill="white"/>
                        </svg>
                        <h1 class="text-2xl sm:text-3xl font-black tracking-tighter">spatialetwo</h1>
                        <p class="text-[11px] sm:text-xs text-white/40 tracking-wider">the minimalist network</p>
                    </div>

                    <div class="w-full max-w-sm space-y-6">
                        <div class="flex glass-panel p-1 rounded-full">
                            <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-3 text-xs sm:text-sm font-bold rounded-full bg-white text-black">login</button>
                            <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-3 text-xs sm:text-sm font-bold rounded-full text-white/70">create account</button>
                        </div>

                        <div id="auth-form-container" class="space-y-4"></div>
                    </div>
                </div>
            `;
            switchAuthTab('login');
        }

        window.switchAuthTab = function(mode) {
            const container = document.getElementById('auth-form-container');
            const loginBtn = document.getElementById('tab-login');
            const signupBtn = document.getElementById('tab-signup');

            if (mode === 'login') {
                loginBtn.className = "flex-1 py-3 text-xs sm:text-sm font-bold rounded-full bg-white text-black";
                signupBtn.className = "flex-1 py-3 text-xs sm:text-sm font-bold rounded-full text-white/70";
                container.innerHTML = `
                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <input type="text" id="login-username" placeholder="username" required 
                            class="w-full px-5 py-4 glass-panel rounded-full text-white placeholder-white/30 text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-white">
                        <input type="password" id="login-password" placeholder="password" required 
                            class="w-full px-5 py-4 glass-panel rounded-full text-white placeholder-white/30 text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-white">
                        <button type="submit" class="w-full py-4 bg-white text-black font-bold text-xs sm:text-sm rounded-full active:scale-95 transition-transform">enter</button>
                    </form>
                `;
            } else {
                signupBtn.className = "flex-1 py-3 text-xs sm:text-sm font-bold rounded-full bg-white text-black";
                loginBtn.className = "flex-1 py-3 text-xs sm:text-sm font-bold rounded-full text-white/70";
                container.innerHTML = `
                    <form onsubmit="handleSignup(event)" class="space-y-4">
                        <input type="text" id="su-name" placeholder="full name" required 
                            class="w-full px-5 py-4 glass-panel rounded-full text-white placeholder-white/30 text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-white">
                        <input type="text" id="su-username" placeholder="username (unique)" required 
                            class="w-full px-5 py-4 glass-panel rounded-full text-white placeholder-white/30 text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-white">
                        <input type="password" id="su-password" placeholder="password" required 
                            class="w-full px-5 py-4 glass-panel rounded-full text-white placeholder-white/30 text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-white">
                        
                        <!-- Dragbar for Age / DOB selection -->
                        <div class="glass-panel p-5 rounded-3xl space-y-3">
                            <div class="flex justify-between text-[11px] sm:text-xs font-semibold text-white/70">
                                <span>age target</span>
                                <span id="age-display" class="text-white font-bold">22 yrs</span>
                            </div>
                            <input type="range" id="su-age-slider" min="13" max="90" value="22" oninput="updateAgeDisplay(this.value)">
                        </div>

                        <!-- Dragbar for Gender Spectrum Selection -->
                        <div class="glass-panel p-5 rounded-3xl space-y-3">
                            <div class="flex justify-between text-[11px] sm:text-xs font-semibold text-white/70">
                                <span>gender orientation</span>
                                <span id="gender-display" class="text-white font-bold">non-binary</span>
                            </div>
                            <input type="range" id="su-gender-slider" min="0" max="3" value="0" step="1" oninput="updateGenderDisplay(this.value)">
                        </div>

                        <textarea id="su-bio" placeholder="short bio..." rows="2" 
                            class="w-full px-5 py-4 glass-panel rounded-3xl text-white placeholder-white/30 text-xs sm:text-sm focus:outline-none resize-none"></textarea>
                        
                        <div class="flex items-center space-x-3 p-2">
                            <div id="avatar-preview" class="w-12 h-12 rounded-full glass-panel flex items-center justify-center overflow-hidden flex-shrink-0">
                                <svg class="w-5 h-5 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            </div>
                            <div class="flex space-x-2 flex-1">
                                <label class="flex-1 text-[11px] sm:text-xs font-semibold text-white/80 glass-panel py-3.5 rounded-full text-center cursor-pointer active:scale-95">
                                    gallery
                                    <input type="file" id="su-avatar-file" accept="image/*" onchange="handleAvatarUpload(event)" class="hidden">
                                </label>
                                <button type="button" onclick="openCameraModal()" class="flex-1 text-[11px] sm:text-xs font-semibold text-white/80 glass-panel py-3.5 rounded-full active:scale-95">
                                    camera
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="w-full py-4 bg-white text-black font-bold text-xs sm:text-sm rounded-full active:scale-95 transition-transform">create account</button>
                    </form>
                `;
            }
        }

        const GENDER_MAP = ["non-binary", "female", "male", "custom"];
        window.updateAgeDisplay = function(val) {
            document.getElementById('age-display').innerText = val + " yrs";
        }
        window.updateGenderDisplay = function(val) {
            document.getElementById('gender-display').innerText = GENDER_MAP[val];
        }

        let pendingAvatarBase64 = null;
        window.handleAvatarUpload = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    pendingAvatarBase64 = e.target.result;
                    const preview = document.getElementById('avatar-preview');
                    if (preview) preview.innerHTML = `<img src="${pendingAvatarBase64}" class="w-full h-full object-cover">`;
                };
                reader.readAsDataURL(file);
            }
        }

        window.openCameraModal = function() {
            const modal = document.getElementById('camera-modal');
            modal.classList.remove('hidden');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                .then(stream => {
                    mediaStream = stream;
                    document.getElementById('camera-stream').srcObject = stream;
                })
                .catch(() => {
                    showModal("Camera access denied or unavailable.");
                    modal.classList.add('hidden');
                });
        }

        window.closeCamera = function() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('camera-modal').classList.add('hidden');
        }

        window.capturePhoto = function() {
            const video = document.getElementById('camera-stream');
            const canvas = document.getElementById('snapshot-canvas');
            canvas.width = video.videoWidth || 300;
            canvas.height = video.videoHeight || 300;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            pendingAvatarBase64 = canvas.toDataURL('image/png');
            const preview = document.getElementById('avatar-preview');
            if (preview) preview.innerHTML = `<img src="${pendingAvatarBase64}" class="w-full h-full object-cover">`;
            closeCamera();
        }

        window.handleSignup = async function(event) {
            event.preventDefault();
            const name = document.getElementById('su-name').value.trim();
            const username = document.getElementById('su-username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
            const password = document.getElementById('su-password').value;
            const age = document.getElementById('su-age-slider').value;
            const genderIndex = document.getElementById('su-gender-slider').value;
            const gender = GENDER_MAP[genderIndex];
            const bio = document.getElementById('su-bio').value.trim();

            if (!username) {
                showModal("Please enter a valid username.");
                return;
            }

            try {
                if (!auth.currentUser) {
                    await signInAnonymously(auth);
                }
                const activeUid = auth.currentUser ? auth.currentUser.uid : 'usr_' + Date.now();

                // Unique Username Verification
                const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
                let usernameTaken = false;
                usersSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data && data.username === username) {
                        usernameTaken = true;
                    }
                });

                if (usernameTaken) {
                    showModal(`@${username} is already taken by another user. Please choose a different username.`);
                    return;
                }

                const newUser = {
                    uid: activeUid,
                    name,
                    username,
                    password,
                    age,
                    gender,
                    bio,
                    avatar: pendingAvatarBase64 || '',
                    followers: [],
                    following: [],
                    createdAt: Date.now()
                };

                // Store in Firestore and Local Storage
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', activeUid), newUser);
                userProfile = newUser;
                localStorage.setItem('spatialetwo_logged_username', username);

                renderMainApp();
            } catch (err) {
                console.error("Signup failed error:", err);
                // Fallback attempt: Save locally if remote rules block setDoc momentarily
                try {
                    const fallbackUid = 'user_' + username;
                    const newUser = {
                        uid: fallbackUid,
                        name,
                        username,
                        password,
                        age,
                        gender,
                        bio,
                        avatar: pendingAvatarBase64 || '',
                        followers: [],
                        following: [],
                        createdAt: Date.now()
                    };
                    userProfile = newUser;
                    localStorage.setItem('spatialetwo_logged_username', username);
                    renderMainApp();
                } catch(e2) {
                    showModal("Failed to create account. Please check your connection and try again.");
                }
            }
        }

        window.handleLogin = async function(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            try {
                const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
                let matchedUser = null;
                usersSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.username === username && data.password === password) {
                        matchedUser = data;
                    }
                });

                if (matchedUser) {
                    userProfile = matchedUser;
                    localStorage.setItem('spatialetwo_logged_username', matchedUser.username);
                    renderMainApp();
                } else {
                    showModal("Invalid username or password.");
                }
            } catch (err) {
                console.error("Login failed:", err);
                showModal("Login failed. Try again.");
            }
        }

        window.logoutUser = function() {
            localStorage.removeItem('spatialetwo_logged_username');
            userProfile = null;
            renderAuthScreen();
        }

        function renderMainApp() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = `
                <!-- Sticky Glass Header -->
                <header class="sticky top-0 z-40 glass-header px-6 py-4 flex items-center justify-between">
                    <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('feed')">
                        <svg class="w-7 h-7 sm:w-8 sm:h-8" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="205" cy="256" r="85" fill="white"/>
                            <circle cx="335" cy="256" r="55" fill="white"/>
                        </svg>
                        <span class="app-title text-sm sm:text-base font-black tracking-tighter">spatialetwo</span>
                    </div>
                    <div class="flex items-center space-x-3">
                        <button onclick="switchTab('notifications')" class="relative p-3 rounded-full glass-panel active:scale-95" title="Notifications">
                            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-white/80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                            <span id="notif-badge" class="hidden absolute top-1.5 right-1.5 w-2 h-2 bg-white rounded-full"></span>
                        </button>
                        <button onclick="switchTab('settings')" class="p-3 rounded-full glass-panel active:scale-95" title="Settings">

                        </button>

                        <svg class="w-5 h-5 sm:w-6 sm:h-6 ${activeTab === 'search' ? 'text-white' : 'text-white/40'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>

                    </button>

            `;
            switchTab(activeTab);
            listenToNotifications();
        }

        window.switchTab = function(tab) {
            activeTab = tab;
            const container = document.getElementById('view-container');
            if (!container) return;
            if (tab === 'feed') renderFeedView(container);
            else if (tab === 'search') renderSearchView(container);
            else if (tab === 'compose') renderComposeView(container);
            else if (tab === 'notifications') renderNotificationsView(container);
            else if (tab === 'settings') renderSettingsView(container);
            else if (tab === 'profile') renderProfileView(container, userProfile.uid);
            else if (tab === 'user-profile') renderProfileView(container, viewProfileUsername);
        }

        function renderFeedView(container) {
            container.innerHTML = `
                <div class="flex flex-col space-y-6 p-6">
                    <div id="posts-feed" class="space-y-6">
                        <div class="text-center py-12 text-white/30 text-xs sm:text-sm">loading feed...</div>
                    </div>
                </div>
            `;
            fetchPosts();
        }

        function fetchPosts() {
            const postsRef = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
            onSnapshot(postsRef, (snapshot) => {
                const posts = [];
                snapshot.forEach(docSnap => {
                    posts.push({ id: docSnap.id, ...docSnap.data() });
                });
                posts.sort((a, b) => b.createdAt - a.createdAt);
                
                const feedEl = document.getElementById('posts-feed');
                if (!feedEl) return;

                if (posts.length === 0) {
                    feedEl.innerHTML = `<div class="text-center py-16 text-white/40 text-xs sm:text-sm">no posts yet. publish your frequency.</div>`;
                    return;
                }

                feedEl.innerHTML = posts.map(post => {
                    const isLiked = post.likes && post.likes.includes(userProfile.uid);
                    return `
                        <div class="flex flex-col space-y-4 p-6 rounded-3xl glass-panel">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3 cursor-pointer" onclick="viewUserProfile('${post.authorUid}')">
                                    <div class="w-10 h-10 rounded-full glass-panel overflow-hidden flex items-center justify-center">
                                        ${post.authorAvatar ? `<img src="${post.authorAvatar}" class="w-full h-full object-cover">` : `<span class="text-xs font-bold">${post.authorUsername ? post.authorUsername[0] : 'u'}</span>`}
                                    </div>
                                    <div>
                                        <h4 class="text-xs sm:text-sm font-bold">@${post.authorUsername}</h4>
                                        <p class="text-[10px] sm:text-xs text-white/30">${new Date(post.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</p>
                                    </div>
                                </div>
                                ${post.authorUid !== userProfile.uid ? `
                                    <button onclick="toggleFollow('${post.authorUid}')" class="px-5 py-2 text-xs font-semibold rounded-full bg-white text-black active:scale-95">
                                        ${userProfile.following && userProfile.following.includes(post.authorUid) ? 'following' : 'follow'}
                                    </button>
                                ` : ''}
                            </div>

                            <p class="post-text text-xs sm:text-sm text-white/90 leading-relaxed whitespace-pre-wrap">${formatPostContent(post.caption)}</p>

                            ${post.media ? `
                                <div class="w-full rounded-3xl overflow-hidden glass-panel">
                                    <img src="${post.media}" class="w-full h-full object-cover" style="aspect-ratio: ${post.ratio || '1/1'}">
                                </div>
                            ` : ''}

                            <div class="flex items-center space-x-6 pt-2 text-white/60 text-xs sm:text-sm">
                                <button onclick="toggleLike('${post.id}')" class="flex items-center space-x-1.5 active:scale-95 ${isLiked ? 'text-white font-bold' : ''}">
                                    <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                                    <span>${post.likes ? post.likes.length : 0}</span>
                                </button>
                                <button onclick="toggleComments('${post.id}')" class="flex items-center space-x-1.5 active:scale-95">
                                    <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                                    <span>${post.comments ? post.comments.length : 0}</span>
                                </button>
                            </div>

                            <div id="comments-section-${post.id}" class="hidden flex flex-col space-y-3 pt-3">
                                <div class="flex space-x-2">
                                    <input type="text" id="comment-input-${post.id}" 
                                        onkeydown="handleCommentKeyDown(event, '${post.id}')"
                                        placeholder="comment or mention @username... (Press Enter)" 
                                        class="flex-1 px-5 py-3 glass-panel rounded-full text-xs sm:text-sm text-white placeholder-white/30 focus:outline-none">
                                    <button onclick="addComment('${post.id}')" class="px-5 py-3 bg-white text-black text-xs sm:text-sm font-bold rounded-full active:scale-95">send</button>
                                </div>
                                <div class="space-y-2">
                                    ${post.comments ? post.comments.map((c, idx) => {
                                        const cLikes = c.likes || [];
                                        const isCommentLiked = cLikes.includes(userProfile.uid);
                                        return `
                                            <div class="glass-panel p-4 rounded-2xl flex items-center justify-between">
                                                <div class="flex flex-col space-y-1">
                                                    <span class="text-[10px] sm:text-xs font-bold text-white/70">@${c.username}</span>
                                                    <p class="text-xs sm:text-sm text-white/90">${formatPostContent(c.text)}</p>
                                                </div>
                                                <button onclick="toggleCommentLike('${post.id}', ${idx}, '${c.uid}')" 
                                                    class="p-2 text-white/50 active:scale-95 flex items-center space-x-1 ${isCommentLiked ? 'text-white font-bold' : ''}">
                                                    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="${isCommentLiked ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                                                    <span class="text-[10px] sm:text-xs">${cLikes.length}</span>
                                                </button>
                                            </div>
                                        `;
                                    }).join('') : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }, (err) => console.error(err));
        }

        function formatPostContent(text) {
            if (!text) return '';
            return text.replace(/(#\w+|@\w+)/g, '<span class="text-white font-bold">$1</span>');
        }

        window.handleCommentKeyDown = function(event, postId) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                addComment(postId);
            }
        }

        window.toggleComments = function(postId) {
            const el = document.getElementById(`comments-section-${postId}`);
            if (el) el.classList.toggle('hidden');
        }

        window.toggleCommentLike = async function(postId, commentIndex, commentAuthorUid) {
            if (commentAuthorUid === userProfile.uid) {
                showModal("You cannot like your own comment.");
                return;
            }

            const postRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', postId);
            const postSnap = await getDoc(postRef);
            if (!postSnap.exists()) return;

            const data = postSnap.data();
            const comments = data.comments || [];
            if (!comments[commentIndex]) return;

            let cLikes = comments[commentIndex].likes || [];
            if (cLikes.includes(userProfile.uid)) {
                cLikes = cLikes.filter(id => id !== userProfile.uid);
            } else {
                cLikes.push(userProfile.uid);
            }
            comments[commentIndex].likes = cLikes;

            await updateDoc(postRef, { comments });
        }

        let composeMediaBase64 = null;
        let composeRatio = '1/1';

        function renderComposeView(container) {
            container.innerHTML = `
                <div class="flex flex-col space-y-6 p-6">
                    <h2 class="text-base sm:text-lg font-black tracking-tight">new frequency</h2>
                    <textarea id="post-caption" 
                        onkeydown="handleComposeKeyDown(event)"
                        placeholder="what's happening? use #hashtags and @mentions... (Press Enter to publish)" rows="4" 
                        class="w-full p-5 glass-panel rounded-3xl text-white placeholder-white/30 text-xs sm:text-sm focus:outline-none resize-none"></textarea>
                    
                    <div class="flex flex-col space-y-4">
                        <div class="flex items-center space-x-2">
                            <label class="flex-1 text-center text-[11px] sm:text-xs font-semibold px-4 py-3.5 rounded-full glass-panel cursor-pointer active:scale-95">
                                gallery
                                <input type="file" id="post-media-file" accept="image/*" onchange="handlePostMediaUpload(event)" class="hidden">
                            </label>
                            <button type="button" onclick="openCameraModal()" class="flex-1 text-[11px] sm:text-xs font-semibold px-4 py-3.5 rounded-full glass-panel active:scale-95">
                                camera
                            </button>
                        </div>

                        <!-- Styled Ratio Selector Buttons -->
                        <div class="glass-panel p-3 rounded-2xl space-y-2">
                            <span class="text-[10px] sm:text-xs font-semibold text-white/50 px-2 uppercase tracking-wider">aspect ratio</span>
                            <div class="flex space-x-2">
                                <button type="button" id="ratio-btn-1-1" onclick="setPostRatio('1/1')" class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-white text-black">1:1 Square</button>
                                <button type="button" id="ratio-btn-16-9" onclick="setPostRatio('16/9')" class="flex-1 py-2.5 rounded-xl text-xs font-bold glass-panel text-white/70">16:9 Wide</button>
                                <button type="button" id="ratio-btn-4-5" onclick="setPostRatio('4/5')" class="flex-1 py-2.5 rounded-xl text-xs font-bold glass-panel text-white/70">4:5 Portrait</button>
                            </div>
                        </div>
                    </div>

                    <div id="compose-preview" class="w-full hidden aspect-square rounded-3xl overflow-hidden glass-panel relative">
                        <img id="compose-preview-img" class="w-full h-full object-cover">
                        <button onclick="removeComposeMedia()" class="absolute top-4 right-4 px-3.5 py-1.5 bg-black/80 text-white text-[10px] sm:text-xs font-bold rounded-full">remove</button>
                    </div>

                    <button onclick="publishPost()" class="w-full py-4 bg-white text-black font-bold text-xs sm:text-sm rounded-full active:scale-95">publish</button>
                </div>
            `;
        }

        window.setPostRatio = function(ratio) {
            composeRatio = ratio;
            const btn1 = document.getElementById('ratio-btn-1-1');
            const btn2 = document.getElementById('ratio-btn-16-9');
            const btn3 = document.getElementById('ratio-btn-4-5');
            
            if (btn1) btn1.className = ratio === '1/1' ? "flex-1 py-2.5 rounded-xl text-xs font-bold bg-white text-black" : "flex-1 py-2.5 rounded-xl text-xs font-bold glass-panel text-white/70";
            if (btn2) btn2.className = ratio === '16/9' ? "flex-1 py-2.5 rounded-xl text-xs font-bold bg-white text-black" : "flex-1 py-2.5 rounded-xl text-xs font-bold glass-panel text-white/70";
            if (btn3) btn3.className = ratio === '4/5' ? "flex-1 py-2.5 rounded-xl text-xs font-bold bg-white text-black" : "flex-1 py-2.5 rounded-xl text-xs font-bold glass-panel text-white/70";

            const preview = document.getElementById('compose-preview');
            if (preview) {
                preview.style.aspectRatio = ratio === '16/9' ? '16/9' : ratio === '4/5' ? '4/5' : '1/1';
            }
        }

        window.handleComposeKeyDown = function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                publishPost();
            }
        }

        window.handlePostMediaUpload = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    composeMediaBase64 = e.target.result;
                    const preview = document.getElementById('compose-preview');
                    const img = document.getElementById('compose-preview-img');
                    if (img) img.src = composeMediaBase64;
                    if (preview) preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        window.removeComposeMedia = function() {
            composeMediaBase64 = null;
            const preview = document.getElementById('compose-preview');
            if (preview) preview.classList.add('hidden');
        }

        window.publishPost = async function() {
            const caption = document.getElementById('post-caption').value.trim();
            if (!caption && !composeMediaBase64) {
                showModal("Please add text or media to publish.");
                return;
            }

            try {
                const newPost = {
                    authorUid: userProfile.uid,
                    authorUsername: userProfile.username,
                    authorAvatar: userProfile.avatar || '',
                    caption,
                    media: composeMediaBase64 || '',
                    ratio: composeRatio,
                    likes: [],
                    comments: [],
                    createdAt: Date.now()
                };

                await setDoc(doc(collection(db, 'artifacts', appId, 'public', 'data', 'posts')), newPost);
                composeMediaBase64 = null;
                switchTab('feed');
            } catch (e) {
                console.error("Error publishing post:", e);
                showModal("Error publishing post.");
            }
        }

        window.toggleLike = async function(postId) {
            const postRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', postId);
            const postSnap = await getDoc(postRef);
            if (!postSnap.exists()) return;
            const data = postSnap.data();
            let likes = data.likes || [];

            if (likes.includes(userProfile.uid)) {
                likes = likes.filter(id => id !== userProfile.uid);
            } else {
                likes.push(userProfile.uid);
            }
            await updateDoc(postRef, { likes });
        }

        window.addComment = async function(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const postRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', postId);
            const postSnap = await getDoc(postRef);
            if (!postSnap.exists()) return;
            const data = postSnap.data();
            const comments = data.comments || [];

            comments.push({
                uid: userProfile.uid,
                username: userProfile.username,
                text,
                likes: [],
                createdAt: Date.now()
            });

            await updateDoc(postRef, { comments });
            input.value = '';
        }

        window.toggleFollow = async function(targetUid) {
            if (targetUid === userProfile.uid) return;
            const targetRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', targetUid);
            const myRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', userProfile.uid);

            const targetSnap = await getDoc(targetRef);
            const mySnap = await getDoc(myRef);
            if (!targetSnap.exists() || !mySnap.exists()) return;

            const targetData = targetSnap.data();
            const myData = mySnap.data();

            let myFollowing = myData.following || [];
            let targetFollowers = targetData.followers || [];

            if (myFollowing.includes(targetUid)) {
                myFollowing = myFollowing.filter(id => id !== targetUid);
                targetFollowers = targetFollowers.filter(id => id !== userProfile.uid);
            } else {
                myFollowing.push(targetUid);
                targetFollowers.push(userProfile.uid);
                
                await addNotification(targetUid, `@${userProfile.username} started following you`);
                sendDeviceNotification("spatialetwo", `@${userProfile.username} started following you`);
            }

            await updateDoc(myRef, { following: myFollowing });
            await updateDoc(targetRef, { followers: targetFollowers });
            userProfile.following = myFollowing;
            renderMainApp();
        }

        async function addNotification(targetUid, text) {
            const notifRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'notifications'));
            await setDoc(notifRef, {
                targetUid,
                text,
                read: false,
                createdAt: Date.now()
            });
        }

        function listenToNotifications() {
            const notifsRef = collection(db, 'artifacts', appId, 'public', 'data', 'notifications');
            onSnapshot(notifsRef, (snapshot) => {
                let count = 0;
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.targetUid === userProfile.uid && !data.read) {
                        count++;
                    }
                });
                const badge = document.getElementById('notif-badge');
                if (badge) {
                    if (count > 0) badge.classList.remove('hidden');
                    else badge.classList.add('hidden');
                }
            });
        }

        function renderNotificationsView(container) {
            container.innerHTML = `
                <div class="flex flex-col space-y-4 p-6">
                    <h2 class="text-base sm:text-lg font-black tracking-tight">notifications</h2>
                    <div id="notifications-list" class="space-y-3">
                        <div class="text-center py-12 text-white/30 text-xs sm:text-sm">loading notifications...</div>
                    </div>
                </div>
            `;
            const notifsRef = collection(db, 'artifacts', appId, 'public', 'data', 'notifications');
            onSnapshot(notifsRef, (snapshot) => {
                const list = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.targetUid === userProfile.uid) {
                        list.push({ id: docSnap.id, ...data });
                    }
                });
                list.sort((a, b) => b.createdAt - a.createdAt);
                const listEl = document.getElementById('notifications-list');
                if (!listEl) return;

                if (list.length === 0) {
                    listEl.innerHTML = `<div class="text-center py-16 text-white/40 text-xs sm:text-sm">no notifications yet</div>`;
                    return;
                }

                listEl.innerHTML = list.map(n => `
                    <div class="p-4 rounded-2xl glass-panel flex items-center justify-between">
                        <p class="text-xs sm:text-sm text-white/90 font-medium">${n.text}</p>
                        <span class="text-[10px] sm:text-xs text-white/40">${new Date(n.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                `).join('');
            });
        }

        function renderSettingsView(container) {
            container.innerHTML = `
                <div class="flex flex-col space-y-6 p-6">
                    <h2 class="text-base sm:text-lg font-black tracking-tight">settings & profile edit</h2>
                    
                    <form onsubmit="saveProfileSettings(event)" class="space-y-4">
                        <div class="space-y-2">
                            <label class="text-[10px] sm:text-xs font-semibold text-white/50 uppercase">full name</label>
                            <input type="text" id="edit-name" value="${userProfile.name || ''}" required 
                                class="w-full px-5 py-4 glass-panel rounded-full text-white text-xs sm:text-sm focus:outline-none">
                        </div>

                        <div class="space-y-2">
                            <label class="text-[10px] sm:text-xs font-semibold text-white/50 uppercase">bio</label>
                            <textarea id="edit-bio" rows="3" class="w-full px-5 py-4 glass-panel rounded-3xl text-white text-xs sm:text-sm focus:outline-none resize-none">${userProfile.bio || ''}</textarea>
                        </div>

                        <button type="submit" class="w-full py-4 bg-white text-black font-bold text-xs sm:text-sm rounded-full active:scale-95">save profile</button>
                    </form>

                    <div class="pt-6 border-t border-white/10 space-y-4">
                        <h3 class="text-xs font-bold text-white/60 uppercase tracking-widest">about</h3>
                        <div class="glass-panel p-5 rounded-3xl space-y-2 text-center">
                            <svg class="w-10 h-10 mx-auto" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="205" cy="256" r="85" fill="white"/>
                                <circle cx="335" cy="256" r="55" fill="white"/>
                            </svg>
                            <p class="text-xs sm:text-sm font-semibold text-white/90">spatialetwo v2.0</p>
                            <p class="text-[11px] sm:text-xs text-white/50 italic">an Alby A production</p>
                        </div>
                    </div>

                    <button onclick="logoutUser()" class="w-full py-4 glass-panel text-white/80 font-bold text-xs sm:text-sm rounded-full active:scale-95">log out</button>
                </div>
            `;
        }

        window.saveProfileSettings = async function(event) {
            event.preventDefault();
            const name = document.getElementById('edit-name').value.trim();
            const bio = document.getElementById('edit-bio').value.trim();

            try {
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', userProfile.uid);
                await updateDoc(userRef, { name, bio });
                userProfile.name = name;
                userProfile.bio = bio;
                showModal("Profile updated successfully.");
            } catch(e) {
                console.error("Save profile failed:", e);
                showModal("Could not save settings. Please try again.");
            }
        }

        function renderSearchView(container) {
            container.innerHTML = `
                <div class="flex flex-col space-y-6 p-6">
                    <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="search users (@username) or #hashtags..." 
                        class="w-full px-5 py-4 glass-panel rounded-full text-white placeholder-white/30 text-xs sm:text-sm focus:outline-none">
                    <div id="search-results" class="space-y-4">
                        <div class="text-center py-12 text-white/30 text-xs sm:text-sm">search network</div>
                    </div>
                </div>
            `;
        }

        window.handleSearch = async function(queryStr) {
            const q = queryStr.trim().toLowerCase();
            const resultsEl = document.getElementById('search-results');
            if (!q) {
                resultsEl.innerHTML = `<div class="text-center py-12 text-white/30 text-xs sm:text-sm">search network</div>`;
                return;
            }

            const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
            const matchingUsers = [];
            usersSnap.forEach(docSnap => {
                const data = docSnap.data();
                if (data.username.includes(q) || (data.name && data.name.toLowerCase().includes(q))) {
                    matchingUsers.push(data);
                }
            });

            resultsEl.innerHTML = matchingUsers.map(u => `
                <div onclick="viewUserProfile('${u.uid}')" class="p-4 rounded-2xl glass-panel flex items-center justify-between cursor-pointer active:scale-98">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full glass-panel overflow-hidden flex items-center justify-center">
                            ${u.avatar ? `<img src="${u.avatar}" class="w-full h-full object-cover">` : `<span class="text-xs font-bold">${u.username ? u.username[0] : 'u'}</span>`}
                        </div>
                        <div>
                            <h4 class="text-xs sm:text-sm font-bold">${u.name}</h4>
                            <p class="text-[10px] sm:text-xs text-white/40">@${u.username}</p>
                        </div>
                    </div>
                    <span class="text-xs sm:text-sm font-semibold text-white/70">view</span>
                </div>
            `).join('') || `<div class="text-center py-12 text-white/40 text-xs sm:text-sm">no users found</div>`;
        }

        window.viewUserProfile = function(uid) {
            viewProfileUsername = uid;
            activeTab = 'user-profile';
            renderProfileView(document.getElementById('view-container'), uid);
        }

        async function renderProfileView(container, targetUid) {
            const isSelf = targetUid === userProfile.uid;
            let profileData = userProfile;

            if (!isSelf) {
                const userSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', targetUid));
                if (userSnap.exists()) profileData = userSnap.data();
            }

            container.innerHTML = `
                <div class="flex flex-col space-y-6 p-6">
                    <div class="flex items-center space-x-5">
                        <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full glass-panel overflow-hidden flex items-center justify-center flex-shrink-0">
                            ${profileData.avatar ? `<img src="${profileData.avatar}" class="w-full h-full object-cover">` : `<span class="text-lg font-bold">${profileData.username ? profileData.username[0] : 'u'}</span>`}
                        </div>
                        <div class="flex flex-col space-y-1">
                            <h2 class="text-base sm:text-xl font-black">${profileData.name}</h2>
                            <p class="text-xs sm:text-sm text-white/40">@${profileData.username}</p>
                            <p class="text-xs sm:text-sm text-white/80 pt-1">${profileData.bio || 'no bio yet'}</p>
                        </div>
                    </div>

                    <div class="flex space-x-6 py-3.5 text-xs sm:text-sm text-white/70 font-semibold glass-panel px-6 rounded-2xl">
                        <div><span class="text-white font-bold">${profileData.followers ? profileData.followers.length : 0}</span> followers</div>
                        <div><span class="text-white font-bold">${profileData.following ? profileData.following.length : 0}</span> following</div>
                    </div>

                    ${!isSelf ? `
                        <button onclick="toggleFollow('${profileData.uid}')" class="w-full py-4 bg-white text-black font-bold text-xs sm:text-sm rounded-full active:scale-95">
                            ${userProfile.following && userProfile.following.includes(profileData.uid) ? 'following' : 'follow'}
                        </button>
                    ` : ''}

                    <div class="space-y-4">
                        <h3 class="text-[10px] sm:text-xs font-bold text-white/40 uppercase tracking-widest">posts</h3>
                        <div id="user-posts-list" class="space-y-4">
                            <div class="text-center py-8 text-white/30 text-xs sm:text-sm">loading posts...</div>
                        </div>
                    </div>
                </div>
            `;

            const postsRef = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
            onSnapshot(postsRef, (snapshot) => {
                const userPosts = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.authorUid === profileData.uid) {
                        userPosts.push({ id: docSnap.id, ...data });
                    }
                });
                userPosts.sort((a, b) => b.createdAt - a.createdAt);

                const listEl = document.getElementById('user-posts-list');
                if (!listEl) return;

                if (userPosts.length === 0) {
                    listEl.innerHTML = `<div class="text-center py-12 text-white/40 text-xs sm:text-sm">no posts yet</div>`;
                    return;
                }

                listEl.innerHTML = userPosts.map(post => `
                    <div class="p-5 rounded-3xl glass-panel space-y-3">
                        <p class="text-xs sm:text-sm text-white/90">${formatPostContent(post.caption)}</p>
                        ${post.media ? `<div class="w-full aspect-square rounded-2xl overflow-hidden glass-panel"><img src="${post.media}" class="w-full h-full object-cover"></div>` : ''}
                    </div>
                `).join('');
            });
        }

        window.onload = function() {
            initAuth();
        }
    </script>
</body>
</html>
