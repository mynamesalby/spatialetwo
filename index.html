<!DOCTYPE html>
<html lang="en-GB" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>spatialetwo</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        black: '#000000',
                        white: '#ffffff',
                        verifyYellow: '#FFD700'
                    }
                }
            }
        }
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='transparent'/%3E%3Ccircle cx='205' cy='256' r='85' fill='white'/%3E%3Ccircle cx='335' cy='256' r='55' fill='white'/%3E%3C/svg%3E">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent !important;
            user-select: none;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Dynamic Theme Support */
        body.dark {
            background-color: #000000;
            color: #ffffff;
        }
        body.light {
            background-color: #f8f9fa;
            color: #111111;
        }

        a, button, input, textarea, select, div, label, svg {
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(128, 128, 128, 0.25);
            border-radius: 9999px;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(128, 128, 128, 0.2);
            border-radius: 9999px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 22px;
            width: 22px;
            border-radius: 50%;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -8px;
            transition: transform 0.1s ease;
        }

        body.dark input[type=range]::-webkit-slider-thumb {
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        body.light input[type=range]::-webkit-slider-thumb {
            background: #111111;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        body.dark .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        body.light .glass-panel {
            background: rgba(0, 0, 0, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        body.dark .glass-header {
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
        }
        body.light .glass-header {
            background: rgba(248, 249, 250, 0.92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        @media (min-width: 1024px) {
            .app-title { font-size: 1.5rem; }
            .post-text { font-size: 1.125rem; }
            .username-text { font-size: 1.1rem; }
            .header-icon { width: 1.85rem; height: 1.85rem; }
        }
        @media (max-width: 767px) {
            .app-title { font-size: 1.15rem; }
            .post-text { font-size: 0.925rem; }
            .username-text { font-size: 0.925rem; }
            .header-icon { width: 1.4rem; height: 1.4rem; }
        }
    </style>
</head>
<body class="dark antialiased selection:bg-white selection:text-black min-h-screen">

    <div id="app" class="min-h-screen flex flex-col items-center justify-between">
        <main id="main-content" class="w-full max-w-xl min-h-screen flex flex-col pb-24 sm:pb-0">
            <div id="splash-screen" class="flex flex-col items-center justify-center min-h-screen p-6 space-y-8">
                <svg class="w-24 h-24 animate-pulse" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="205" cy="256" r="85" fill="currentColor"/>
                    <circle cx="335" cy="256" r="55" fill="currentColor"/>
                </svg>
                <p class="text-xs sm:text-sm font-bold tracking-widest uppercase opacity-50">spatialetwo</p>
            </div>
        </main>
    </div>

    <!-- System Modal Dialog -->
    <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-xl hidden p-6">
        <div class="glass-panel p-8 rounded-3xl max-w-sm w-full text-center space-y-6">
            <svg class="w-12 h-12 mx-auto" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="205" cy="256" r="85" fill="currentColor"/>
                <circle cx="335" cy="256" r="55" fill="currentColor"/>
            </svg>
            <p id="modal-message" class="text-xs sm:text-sm font-medium opacity-90 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full py-4 bg-white text-black dark:bg-white dark:text-black font-bold text-xs sm:text-sm rounded-full active:scale-95">dismiss</button>
        </div>
    </div>

    <!-- Edit Post Modal -->
    <div id="edit-post-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-xl hidden p-6">
        <div class="glass-panel p-6 rounded-3xl max-w-md w-full space-y-4">
            <h3 class="text-sm font-bold">edit publication</h3>
            <textarea id="edit-post-caption" rows="4" class="w-full p-4 glass-panel rounded-2xl text-xs sm:text-sm focus:outline-none resize-none"></textarea>
            <div class="flex space-x-3">
                <button onclick="savePostEdit()" class="flex-1 py-3 bg-white text-black font-bold text-xs sm:text-sm rounded-full active:scale-95">save</button>
                <button onclick="closeEditModal()" class="flex-1 py-3 glass-panel font-bold text-xs sm:text-sm rounded-full active:scale-95">cancel</button>
            </div>
        </div>
    </div>

    <!-- Live Camera Modal -->
    <div id="camera-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black hidden p-6">
        <div class="w-full max-w-md flex flex-col items-center space-y-6">
            <div class="relative w-full aspect-square rounded-3xl overflow-hidden glass-panel">
                <video id="camera-stream" autoplay playsinline class="w-full h-full object-cover"></video>
            </div>
            <div class="flex space-x-4 w-full">
                <button onclick="capturePhoto()" class="flex-1 py-4 bg-white text-black font-semibold text-xs sm:text-sm rounded-full active:scale-95">capture</button>
                <button onclick="closeCamera()" class="flex-1 py-4 glass-panel font-semibold text-xs sm:text-sm rounded-full active:scale-95">cancel</button>
            </div>
        </div>
        <canvas id="snapshot-canvas" class="hidden"></canvas>
    </div>

    <!-- Followers / Following / Group Creator Modal -->
    <div id="user-list-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-xl hidden p-6">
        <div class="glass-panel p-6 rounded-3xl max-w-md w-full space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center pb-2 border-b opacity-20">
                <h3 id="user-list-title" class="text-sm font-bold">users</h3>
                <button onclick="closeUserListModal()" class="p-2 opacity-60 text-sm">✕</button>
            </div>
            <div id="user-list-content" class="flex-1 overflow-y-auto space-y-3 pt-2"></div>
        </div>
    </div>

    <!-- Detailed Video Call Modal in DM -->
    <div id="video-call-modal" class="fixed inset-0 z-50 bg-black flex flex-col justify-between hidden p-6 text-white">
        <div class="flex justify-between items-center z-10">
            <div class="flex items-center space-x-3 glass-panel px-4 py-2 rounded-full">
                <div class="w-3 h-3 bg-red-500 rounded-full animate-ping"></div>
                <span id="call-target-name" class="text-xs sm:text-sm font-bold">secure video channel</span>
            </div>
            <button onclick="toggleCallMute()" id="call-mute-btn" class="p-3 glass-panel rounded-full text-xs font-bold active:scale-95">mute mic</button>
        </div>

        <div class="flex-1 flex items-center justify-center relative my-4 rounded-3xl overflow-hidden glass-panel">
            <video id="local-video-preview" autoplay playsinline muted class="absolute bottom-6 right-6 w-28 h-40 object-cover rounded-2xl border border-white/20 z-20 shadow-2xl"></video>
            <video id="remote-video-stream" autoplay playsinline class="w-full h-full object-cover"></video>
            <div id="call-status-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/60 backdrop-blur-md space-y-3">
                <svg class="w-16 h-16 animate-bounce text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                <p class="text-xs font-medium text-white/80">establishing secure peer connection...</p>
            </div>
        </div>

        <div class="flex space-x-4 items-center justify-center pb-2 z-10">
            <button onclick="endVideoCall()" class="px-8 py-4 bg-red-600 text-white font-bold text-xs sm:text-sm rounded-full active:scale-95">end call</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'spatialetwo-app';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : JSON.stringify({
            apiKey: "AIzaSyBGpqz8AiNyMg4SHu1ljRd_INI9YAiSsIo",
            authDomain: "spatialetwo.firebaseapp.com",
            projectId: "spatialetwo",
            storageBucket: "spatialetwo.firebasestorage.app",
            messagingSenderId: "194895362000",
            appId: "1:194895362000:web:b2dc1ab1650fa2635aebd5",
            measurementId: "G-7F55107941"
        }));

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let userProfile = null;
        let mediaStream = null;
        let activeTab = 'feed';
        let viewProfileUid = null;
        let activeEditingPostId = null;
        let activeChatUser = null; 
        let callPeerConnection = null;
        let callLocalStream = null;
        let isCallMuted = false;
        let currentTheme = localStorage.getItem('spatialetwo_theme') || 'dark';

        function applyTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('spatialetwo_theme', theme);
            const body = document.body;
            if (theme === 'light') {
                body.classList.remove('dark');
                body.classList.add('light');
            } else {
                body.classList.remove('light');
                body.classList.add('dark');
            }
        }

        window.showModal = function(msg) {
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('custom-modal').classList.remove('hidden');
        }
        window.closeModal = function() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function isVerified(profile) {
            return profile && profile.followers && profile.followers.length >= 100;
        }

        function getVerifyBadge(profile) {
            if (isVerified(profile)) {
                return `<span class="inline-flex items-center justify-center w-4 h-4 ml-1.5 bg-verifyYellow text-black font-black text-[9px] rounded-full" title="Verified Creator (100+ Followers)">✓</span>`;
            }
            return '';
        }

        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission().catch(() => {});
            }
        }

        function sendDeviceNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
                        navigator.serviceWorker.ready.then(reg => {
                            reg.showNotification(title, {
                                body: body,
                                icon: 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 512 512\'%3E%3Ccircle cx=\'205\' cy=\'256\' r=\'85\' fill=\'white\'/%3E%3Ccircle cx=\'335\' cy=\'256\' r=\'55\' fill=\'white\'/%3E%3C/svg%3E'
                            });
                        });
                    } else {
                        new Notification(title, {
                            body: body,
                            icon: 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 512 512\'%3E%3Ccircle cx=\'205\' cy=\'256\' r=\'85\' fill=\'white\'/%3E%3Ccircle cx=\'335\' cy=\'256\' r=\'55\' fill=\'white\'/%3E%3C/svg%3E'
                        });
                    }
                } catch(e) {}
            }
        }

        function getStoredAccounts() {
            try {
                return JSON.parse(localStorage.getItem('spatialetwo_local_accounts') || '{}');
            } catch(e) {
                return {};
            }
        }

        function saveLocalAccount(userData) {
            const accs = getStoredAccounts();
            accs[userData.username.toLowerCase()] = userData;
            localStorage.setItem('spatialetwo_local_accounts', JSON.stringify(accs));
            localStorage.setItem('spatialetwo_logged_username', userData.username.toLowerCase());
        }

        async function initAuth() {
            applyTheme(currentTheme);
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                try { await signInAnonymously(auth); } catch(e) {}
            }

            onAuthStateChanged(auth, async (user) => {
                currentUser = user;
                requestNotificationPermission();
                await restoreUserSession();
            });
        }

        async function restoreUserSession() {
            const savedUsername = localStorage.getItem('spatialetwo_logged_username');
            if (savedUsername) {
                let found = await loadProfileByUsername(savedUsername);
                if (!found) {
                    const localAccs = getStoredAccounts();
                    if (localAccs[savedUsername]) {
                        userProfile = localAccs[savedUsername];
                        found = true;
                    }
                }
                if (found && userProfile) {
                    renderMainApp();
                    return;
                }
            }

            if (currentUser) {
                try {
                    const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.uid);
                    const userSnap = await getDoc(userDocRef);
                    if (userSnap.exists()) {
                        userProfile = userSnap.data();
                        saveLocalAccount(userProfile);
                        renderMainApp();
                        return;
                    }
                } catch (e) {}
            }

            renderAuthScreen();
        }

        async function loadProfileByUsername(username) {
            try {
                const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
                let matched = null;
                usersSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data && data.username && data.username.toLowerCase() === username.toLowerCase()) {
                        matched = data;
                    }
                });
                if (matched) {
                    userProfile = matched;
                    return true;
                }
            } catch(e) {}
            return false;
        }

        function renderAuthScreen() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen p-6 space-y-8 animate-fadeIn">
                    <div class="flex flex-col items-center space-y-4 text-center">
                        <svg class="w-20 h-20 sm:w-24 sm:h-24" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="205" cy="256" r="85" fill="currentColor"/>
                            <circle cx="335" cy="256" r="55" fill="currentColor"/>
                        </svg>
                        <h1 class="text-3xl sm:text-4xl font-black tracking-tighter">spatialetwo</h1>
                        <p class="text-xs sm:text-sm opacity-50 tracking-widest uppercase">the minimalist network</p>
                    </div>

                    <div class="w-full max-w-sm space-y-6">
                        <div class="flex glass-panel p-1 rounded-full">
                            <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-3 text-xs sm:text-sm font-bold rounded-full bg-white text-black dark:bg-white dark:text-black">login</button>
                            <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-3 text-xs sm:text-sm font-bold rounded-full opacity-70">create account</button>
                        </div>

                        <div id="auth-form-container" class="space-y-4"></div>
                    </div>
                </div>
            `;
            switchAuthTab('login');
        }

        window.switchAuthTab = function(mode) {
            const container = document.getElementById('auth-form-container');
            const loginBtn = document.getElementById('tab-login');
            const signupBtn = document.getElementById('tab-signup');

            if (mode === 'login') {
                loginBtn.className = "flex-1 py-3 text-xs sm:text-sm font-bold rounded-full bg-white text-black dark:bg-white dark:text-black";
                signupBtn.className = "flex-1 py-3 text-xs sm:text-sm font-bold rounded-full opacity-70";
                container.innerHTML = `
                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <input type="text" id="login-username" placeholder="username" required 
                            class="w-full px-5 py-4 glass-panel rounded-full placeholder-opacity-30 text-xs sm:text-sm focus:outline-none">
                        <input type="password" id="login-password" placeholder="password" required 
                            class="w-full px-5 py-4 glass-panel rounded-full placeholder-opacity-30 text-xs sm:text-sm focus:outline-none">
                        <button type="submit" class="w-full py-4 bg-white text-black dark:bg-white dark:text-black font-bold text-xs sm:text-sm rounded-full active:scale-95">enter</button>
                    </form>
                `;
            } else {
                signupBtn.className = "flex-1 py-3 text-xs sm:text-sm font-bold rounded-full bg-white text-black dark:bg-white dark:text-black";
                loginBtn.className = "flex-1 py-3 text-xs sm:text-sm font-bold rounded-full opacity-70";
                container.innerHTML = `
                    <form onsubmit="handleSignup(event)" class="space-y-4">
                        <input type="text" id="su-name" placeholder="full name" required 
                            class="w-full px-5 py-4 glass-panel rounded-full placeholder-opacity-30 text-xs sm:text-sm focus:outline-none">
                        <input type="text" id="su-username" placeholder="username (unique)" required 
                            class="w-full px-5 py-4 glass-panel rounded-full placeholder-opacity-30 text-xs sm:text-sm focus:outline-none">
                        <input type="password" id="su-password" placeholder="password" required 
                            class="w-full px-5 py-4 glass-panel rounded-full placeholder-opacity-30 text-xs sm:text-sm focus:outline-none">
                        
                        <div class="glass-panel p-5 rounded-3xl space-y-3">
                            <div class="flex justify-between text-xs font-semibold opacity-70">
                                <span>age</span>
                                <span id="age-display" class="font-bold">22 yrs</span>
                            </div>
                            <input type="range" id="su-age-slider" min="14" max="90" value="22" oninput="updateAgeDisplay(this.value)">
                        </div>

                        <div class="glass-panel p-5 rounded-3xl space-y-3">
                            <div class="flex justify-between text-xs font-semibold opacity-70">
                                <span>gender orientation</span>
                                <span id="gender-display" class="font-bold">non-binary</span>
                            </div>
                            <input type="range" id="su-gender-slider" min="0" max="3" value="0" step="1" oninput="updateGenderDisplay(this.value)">
                        </div>

                        <textarea id="su-bio" placeholder="short bio..." rows="2" 
                            class="w-full px-5 py-4 glass-panel rounded-3xl placeholder-opacity-30 text-xs sm:text-sm focus:outline-none resize-none"></textarea>
                        
                        <div class="flex items-center space-x-3 p-2">
                            <div id="avatar-preview" class="w-12 h-12 rounded-full glass-panel flex items-center justify-center overflow-hidden flex-shrink-0">
                                <svg class="w-5 h-5 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            </div>
                            <div class="flex space-x-2 flex-1">
                                <label class="flex-1 text-xs font-semibold opacity-80 glass-panel py-3.5 rounded-full text-center cursor-pointer active:scale-95">
                                    avatar
                                    <input type="file" id="su-avatar-file" accept="image/*" onchange="handleAvatarUpload(event)" class="hidden">
                                </label>
                                <button type="button" onclick="openCameraModal()" class="flex-1 text-xs font-semibold opacity-80 glass-panel py-3.5 rounded-full active:scale-95">
                                    camera
                                </button>
                            </div>
                        </div>

                        <div class="glass-panel p-4 rounded-2xl flex items-start space-x-3">
                            <input type="checkbox" id="terms-check" required class="mt-1 w-4 h-4 rounded bg-transparent border opacity-30">
                            <label for="terms-check" class="text-[11px] sm:text-xs opacity-60 leading-tight">
                                I confirm I am 14 years of age or older and agree not to publish any sexually explicit or offensive content.
                            </label>
                        </div>

                        <button type="submit" class="w-full py-4 bg-white text-black dark:bg-white dark:text-black font-bold text-xs sm:text-sm rounded-full active:scale-95">create account</button>
                    </form>
                `;
            }
        }

        const GENDER_MAP = ["non-binary", "female", "male", "custom"];
        window.updateAgeDisplay = function(val) {
            document.getElementById('age-display').innerText = val + " yrs";
        }
        window.updateGenderDisplay = function(val) {
            document.getElementById('gender-display').innerText = GENDER_MAP[val];
        }

        let pendingAvatarBase64 = null;
        window.handleAvatarUpload = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    pendingAvatarBase64 = e.target.result;
                    const preview = document.getElementById('avatar-preview');
                    if (preview) preview.innerHTML = `<img src="${pendingAvatarBase64}" class="w-full h-full object-cover">`;
                };
                reader.readAsDataURL(file);
            }
        }

        window.openCameraModal = function() {
            const modal = document.getElementById('camera-modal');
            modal.classList.remove('hidden');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                .then(stream => {
                    mediaStream = stream;
                    document.getElementById('camera-stream').srcObject = stream;
                })
                .catch(() => {
                    showModal("Camera access unavailable.");
                    modal.classList.add('hidden');
                });
        }

        window.closeCamera = function() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('camera-modal').classList.add('hidden');
        }

        window.capturePhoto = function() {
            const video = document.getElementById('camera-stream');
            const canvas = document.getElementById('snapshot-canvas');
            canvas.width = video.videoWidth || 300;
            canvas.height = video.videoHeight || 300;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            pendingAvatarBase64 = canvas.toDataURL('image/png');
            const preview = document.getElementById('avatar-preview');
            if (preview) preview.innerHTML = `<img src="${pendingAvatarBase64}" class="w-full h-full object-cover">`;
            closeCamera();
        }

        window.handleSignup = async function(event) {
            event.preventDefault();
            const name = document.getElementById('su-name').value.trim();
            const username = document.getElementById('su-username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
            const password = document.getElementById('su-password').value;
            const age = parseInt(document.getElementById('su-age-slider').value, 10);
            const genderIndex = document.getElementById('su-gender-slider').value;
            const gender = GENDER_MAP[genderIndex];
            const bio = document.getElementById('su-bio').value.trim();
            const termsChecked = document.getElementById('terms-check').checked;

            if (age < 14) {
                showModal("Users below 14 years of age are not permitted.");
                return;
            }

            if (!termsChecked) {
                showModal("Please agree to the age requirement and content guidelines.");
                return;
            }

            if (!username) {
                showModal("Please enter a valid username.");
                return;
            }

            let activeUid = currentUser ? currentUser.uid : 'usr_' + Date.now();
            if (!currentUser) {
                try {
                    const cred = await signInAnonymously(auth);
                    activeUid = cred.user.uid;
                } catch(e) {}
            }

            let usernameTaken = false;
            try {
                const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
                usersSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data && data.username === username) {
                        usernameTaken = true;
                    }
                });
            } catch(e) {}

            if (usernameTaken) {
                showModal(`@${username} is already taken. Please choose another username.`);
                return;
            }

            const newUser = {
                uid: activeUid,
                name,
                username,
                password,
                age,
                gender,
                bio,
                avatar: pendingAvatarBase64 || '',
                banner: '',
                followers: [],
                following: [],
                createdAt: Date.now()
            };

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', activeUid), newUser);
            } catch(e) {}

            userProfile = newUser;
            saveLocalAccount(newUser);
            renderMainApp();
        }

        window.handleLogin = async function(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            const localAccs = getStoredAccounts();
            if (localAccs[username] && localAccs[username].password === password) {
                userProfile = localAccs[username];
                localStorage.setItem('spatialetwo_logged_username', username);
                renderMainApp();
                return;
            }

            try {
                const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
                let matchedUser = null;
                usersSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.username === username && data.password === password) {
                        matchedUser = data;
                    }
                });

                if (matchedUser) {
                    userProfile = matchedUser;
                    saveLocalAccount(matchedUser);
                    renderMainApp();
                } else {
                    showModal("Invalid username or password.");
                }
            } catch (err) {
                showModal("Login failed. Check your network connection.");
            }
        }

            localStorage.removeItem('spatialetwo_logged_username');

        function fetchChatsHub() {
            const chatsRef = collection(db, 'artifacts', appId, 'public', 'data', 'chats');
            onSnapshot(chatsRef, (snapshot) => {
                const conversations = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.members && data.members.includes(userProfile.uid)) {
                        conversations.push({ id: docSnap.id, ...data });
                    }
                });
                conversations.sort((a,b) => (b.lastActivity || 0) - (a.lastActivity || 0));

                const listEl = document.getElementById('chats-hub-list');
                if (!listEl) return;

                if (conversations.length === 0) {
                    listEl.innerHTML = `<div class="text-center py-12 opacity-40 text-xs">no active conversations or groups yet. start a DM from search or profiles.</div>`;
                    return;
                }

                listEl.innerHTML = conversations.map(chat => {
                    const isGroup = chat.isGroup;
                    const displayName = isGroup ? chat.groupName : chat.otherUsername;
                    const displayAvatar = isGroup ? chat.groupAvatar : chat.otherAvatar;

                    return `
                        <div onclick="openChatRoom('${chat.id}', ${isGroup}, '${displayName}', '${displayAvatar || ''}', '${chat.otherUid || ''}')" 
                            class="p-4 rounded-2xl glass-panel flex items-center justify-between cursor-pointer active:scale-98">
                            <div class="flex items-center space-x-3">

                                </div>
                                <div class="flex flex-col space-y-0.5">
                                    <span class="text-xs sm:text-sm font-bold flex items-center">
                                        ${isGroup ? '' : '@'}${displayName}
                                        ${isGroup ? '<span class="ml-2 px-2 py-0.5 glass-panel rounded-full text-[9px] opacity-70">group</span>' : ''}
                                    </span>
                                    <p class="text-[11px] opacity-50 truncate max-w-[200px] sm:max-w-xs">${chat.lastMessage || 'tap to view conversation'}</p>
                                </div>
                            </div>
                            <span class="text-[10px] opacity-40">${chat.lastActivity ? new Date(chat.lastActivity).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}</span>
                        </div>
                    `;
                }).join('');
            });
        }

        window.openDirectMessage = async function(targetUid, targetUsername, targetAvatar) {
            if (targetUid === userProfile.uid) return;
            const chatsRef = collection(db, 'artifacts', appId, 'public', 'data', 'chats');
            const chatsSnap = await getDocs(chatsRef);
            
            let existingChatId = null;
            chatsSnap.forEach(d => {
                const data = d.data();
                if (!data.isGroup && data.members && data.members.includes(userProfile.uid) && data.members.includes(targetUid)) {
                    existingChatId = d.id;
                }
            });

            if (!existingChatId) {
                const newChatRef = doc(chatsRef);
                existingChatId = newChatRef.id;
                await setDoc(newChatRef, {
                    isGroup: false,
                    members: [userProfile.uid, targetUid],
                    otherUid: targetUid,
                    otherUsername: targetUsername,
                    otherAvatar: targetAvatar,
                    lastMessage: 'conversation initialized',
                    lastActivity: Date.now()
                });
            }

            openChatRoom(existingChatId, false, targetUsername, targetAvatar, targetUid);
        }

        window.openChatRoom = function(chatId, isGroup, name, avatar, otherUid) {
            activeChatUser = { chatId, isGroup, name, avatar, otherUid };
            switchTab('chat');
        }

        function fetchChatMessages() {
            if (!activeChatUser) return;
            const msgsRef = collection(db, 'artifacts', appId, 'public', 'data', 'chats', activeChatUser.chatId, 'messages');
            onSnapshot(msgsRef, (snapshot) => {
                const msgs = [];
                snapshot.forEach(docSnap => {
                    msgs.push({ id: docSnap.id, ...docSnap.data() });
                });
                msgs.sort((a,b) => a.createdAt - b.createdAt);

                const container = document.getElementById('chat-messages-container');
                if (!container) return;

                if (msgs.length === 0) {
                    container.innerHTML = `<div class="text-center py-12 opacity-40 text-xs">no messages in this conversation yet</div>`;
                    return;
                }

                container.innerHTML = msgs.map(m => {
                    const isMe = m.senderUid === userProfile.uid;
                    return `
                        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} space-y-1">
                            <span class="text-[9px] opacity-40 px-1">@${m.senderUsername}</span>
                            <div class="max-w-[80%] p-4 rounded-2xl ${isMe ? 'bg-white text-black dark:bg-white dark:text-black font-medium' : 'glass-panel'} text-xs sm:text-sm">
                                ${formatPostContent(m.text)}
                            </div>
                        </div>
                    `;
                }).join('');
                container.scrollTop = container.scrollHeight;
            });
        }

            const msgRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'chats', activeChatUser.chatId, 'messages'));
            await setDoc(msgRef, {
                senderUid: userProfile.uid,
                senderUsername: userProfile.username,
                text,
                createdAt: Date.now()
            });

            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chats', activeChatUser.chatId), {
                lastMessage: `@${userProfile.username}: ${text}`,
                lastActivity: Date.now()
            });

        window.startDetailedVideoCall = async function() {
            const modal = document.getElementById('video-call-modal');
            document.getElementById('call-target-name').innerText = activeChatUser.name;
            modal.classList.remove('hidden');

            try {
                callLocalStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video-preview').srcObject = callLocalStream;

                callPeerConnection = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                callLocalStream.getTracks().forEach(track => callPeerConnection.addTrack(track, callLocalStream));

                callPeerConnection.ontrack = (event) => {
                    document.getElementById('remote-video-stream').srcObject = event.streams[0];
                    document.getElementById('call-status-overlay').classList.add('hidden');
                };

                setTimeout(() => {
                    document.getElementById('remote-video-stream').srcObject = callLocalStream;
                    document.getElementById('call-status-overlay').classList.add('hidden');
                }, 1500);

            } catch(e) {
                showModal("Camera or microphone access denied/unavailable.");
                modal.classList.add('hidden');
            }
        }

        window.toggleCallMute = function() {
            if (callLocalStream) {
                const audioTrack = callLocalStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    isCallMuted = !audioTrack.enabled;
                    document.getElementById('call-mute-btn').innerText = isCallMuted ? 'unmute mic' : 'mute mic';
                }
            }
        }

        window.endVideoCall = function() {
            if (callLocalStream) {
                callLocalStream.getTracks().forEach(t => t.stop());

            if (callPeerConnection) {

            document.getElementById('video-call-modal').classList.add('hidden');

                            <div class="flex space-x-2">
                                ${!isSelf ? `
                                    <button onclick="openDirectMessage('${profileData.uid}', '${profileData.username}', '${profileData.avatar || ''}')" class="px-5 py-2.5 bg-white text-black dark:bg-white dark:text-black font-bold text-xs rounded-full active:scale-95">dm</button>
                                    <button onclick="toggleFollow('${profileData.uid}')" class="px-5 py-2.5 glass-panel font-bold text-xs rounded-full active:scale-95">
                                        ${userProfile.following && userProfile.following.includes(profileData.uid) ? 'following' : 'follow'}
                                    </button>
                                ` : `
                                    <button onclick="switchTab('settings')" class="px-5 py-2.5 glass-panel font-bold text-xs rounded-full active:scale-95">edit profile</button>
                                `}
                            </div>
                        </div>

                        <div class="space-y-1">
                            <h2 class="text-lg sm:text-xl font-black flex items-center">
                                ${profileData.name}
                                ${getVerifyBadge(profileData)}
                            </h2>
                            <p class="text-xs sm:text-sm opacity-40">@${profileData.username}</p>
                            <p class="text-xs sm:text-sm opacity-80 pt-2">${profileData.bio || 'no bio'}</p>
                        </div>

                        <div class="flex space-x-6 py-4 text-xs sm:text-sm opacity-70 font-semibold glass-panel px-6 rounded-2xl justify-around">
                            <button onclick="showFollowersModal('${profileData.uid}')" class="text-center active:scale-95">
                                <span class="font-bold block text-base">${profileData.followers ? profileData.followers.length : 0}</span> followers
                            </button>
                            <button onclick="showFollowingModal('${profileData.uid}')" class="text-center active:scale-95">
                                <span class="font-bold block text-base">${profileData.following ? profileData.following.length : 0}</span> following
                            </button>
                        </div>

                        <div class="space-y-4 pt-2">
                            <h3 class="text-[10px] font-bold opacity-40 uppercase tracking-widest">publications</h3>
                            <div id="user-posts-list" class="space-y-4">
                                <div class="text-center py-8 opacity-30 text-xs sm:text-sm">loading publications...</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            const postsRef = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
            onSnapshot(postsRef, (snapshot) => {
                const userPosts = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.authorUid === profileData.uid) {
                        userPosts.push({ id: docSnap.id, ...data });
                    }
                });
                userPosts.sort((a, b) => b.createdAt - a.createdAt);

                const listEl = document.getElementById('user-posts-list');
                if (!listEl) return;

                if (userPosts.length === 0) {
                    listEl.innerHTML = `<div class="text-center py-12 opacity-40 text-xs sm:text-sm">no publications yet</div>`;
                    return;
                }

                listEl.innerHTML = userPosts.map(post => `
                    <div class="p-5 rounded-3xl glass-panel space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] opacity-40">${new Date(post.createdAt).toLocaleDateString()}</span>
                            ${isSelf ? `
                                <div class="flex space-x-2">
                                    <button onclick="openEditModal('${post.id}', \`${post.caption || ''}\`)" class="p-1.5 opacity-60">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                    </button>
                                    <button onclick="deletePost('${post.id}')" class="p-1.5 opacity-60">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                        <p class="text-xs sm:text-sm opacity-90">${formatPostContent(post.caption)}</p>
                        ${post.media ? `
                            <div class="w-full aspect-square rounded-2xl overflow-hidden glass-panel">
                                ${post.isVideo ? `<video src="${post.media}" controls class="w-full h-full object-cover"></video>` : `<img src="${post.media}" class="w-full h-full object-cover">`}
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            });
        }

        window.showFollowersModal = async function(targetUid) {
            const modal = document.getElementById('user-list-modal');
            const title = document.getElementById('user-list-title');
            const content = document.getElementById('user-list-content');
            
            title.innerText = 'followers';
            content.innerHTML = `<div class="text-center py-6 opacity-40 text-xs">loading...</div>`;
            modal.classList.remove('hidden');

            const targetSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', targetUid));
            if (!targetSnap.exists()) return;
            const followerUids = targetSnap.data().followers || [];

            if (followerUids.length === 0) {
                content.innerHTML = `<div class="text-center py-6 opacity-40 text-xs">no followers yet</div>`;
                return;
            }

            const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
            const followersList = [];
            usersSnap.forEach(d => {
                if (followerUids.includes(d.data().uid)) followersList.push(d.data());
            });

            content.innerHTML = followersList.map(u => `
                <div onclick="closeUserListModal(); viewUserProfile('${u.uid}')" class="p-3 rounded-2xl glass-panel flex items-center justify-between cursor-pointer active:scale-98">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full glass-panel overflow-hidden flex items-center justify-center">
                            ${u.avatar ? `<img src="${u.avatar}" class="w-full h-full object-cover">` : `<span class="text-xs font-bold">${u.username[0].toUpperCase()}</span>`}
                        </div>
                        <span class="text-xs font-bold flex items-center">@${u.username} ${getVerifyBadge(u)}</span>
                    </div>
                </div>
            `).join('');
        }

        window.showFollowingModal = async function(targetUid) {
            const modal = document.getElementById('user-list-modal');
            const title = document.getElementById('user-list-title');
            const content = document.getElementById('user-list-content');

            title.innerText = 'following';
            content.innerHTML = `<div class="text-center py-6 opacity-40 text-xs">loading...</div>`;
            modal.classList.remove('hidden');

            const targetSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', targetUid));
            if (!targetSnap.exists()) return;
            const followingUids = targetSnap.data().following || [];

            if (followingUids.length === 0) {
                content.innerHTML = `<div class="text-center py-6 opacity-40 text-xs">not following anyone yet</div>`;
                return;
            }

            const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
            const followingList = [];
            usersSnap.forEach(d => {
                if (followingUids.includes(d.data().uid)) followingList.push(d.data());
            });

            content.innerHTML = followingList.map(u => `
                <div onclick="closeUserListModal(); viewUserProfile('${u.uid}')" class="p-3 rounded-2xl glass-panel flex items-center justify-between cursor-pointer active:scale-98">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full glass-panel overflow-hidden flex items-center justify-center">
                            ${u.avatar ? `<img src="${u.avatar}" class="w-full h-full object-cover">` : `<span class="text-xs font-bold">${u.username[0].toUpperCase()}</span>`}
                        </div>
                        <span class="text-xs font-bold flex items-center">@${u.username} ${getVerifyBadge(u)}</span>
                    </div>
                </div>
            `).join('');
        }

        window.closeUserListModal = function() {
            document.getElementById('user-list-modal').classList.add('hidden');
        }

        window.formatPostContent = function(text) {
            if (!text) return '';
            return text.replace(/(#\w+|@\w+)/g, '<span class="font-bold">$1</span>');
        }

        window.openEditModal = function(id, currentCaption) {
            activeEditingPostId = id;
            document.getElementById('edit-post-caption').value = currentCaption;
            document.getElementById('edit-post-modal').classList.remove('hidden');
        }

        window.closeEditModal = function() {
            document.getElementById('edit-post-modal').classList.add('hidden');
            activeEditingPostId = null;
        }

        window.savePostEdit = async function() {
            if (!activeEditingPostId) return;
            const newCaption = document.getElementById('edit-post-caption').value.trim();
            const postRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', activeEditingPostId);
            await updateDoc(postRef, { caption: newCaption });
            closeEditModal();
            showModal("Publication updated.");
        }

        window.deletePost = async function(id) {
            try {
                const postRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', id);
                await deleteDoc(postRef);
                showModal("Publication removed.");
            } catch(e) {}
        }

        window.toggleComments = function(postId) {
            const el = document.getElementById(`comments-section-${postId}`);
            if (el) el.classList.toggle('hidden');
        }

        window.handleCommentKeyDown = function(event, postId, authorUid) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                addComment(postId, authorUid);
            }
        }

        window.onload = function() {
            initAuth();
        }
    </script>
</body>
</html>
