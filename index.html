<!DOCTYPE html>
<html lang="en-GB" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>spatialetwo</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        black: '#000000',
                        white: '#ffffff',
                        verifyYellow: '#FFD700'
                    }
                }
            }
        }
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='transparent'/%3E%3Ccircle cx='205' cy='256' r='85' fill='currentColor'/%3E%3Ccircle cx='335' cy='256' r='55' fill='currentColor'/%3E%3C/svg%3E">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent !important;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Clean Theme Support without heavy boxes */
        body.dark {
            background-color: #000000;
            color: #ffffff;
        }
        body.light {
            background-color: #ffffff;
            color: #111111;
        }

        a, button, input, textarea, select, div, label, svg {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(128, 128, 128, 0.2);
            border-radius: 9999px;
        }

        /* Device-specific layout adaptation */
        .pc-sidebar { display: none; }
        .tablet-sidebar { display: none; }
        .mobile-nav { display: flex; }

        @media (min-width: 1024px) {
            .pc-sidebar { display: flex; }
            .mobile-nav { display: none !important; }
            .tablet-sidebar { display: none !important; }
            .app-main-layout {
                max-width: 1100px;
                margin-left: 280px;
                padding: 2rem 3rem;
            }
        }

        @media (min-width: 768px) and (max-width: 1023px) {
            .tablet-sidebar { display: flex; }
            .pc-sidebar { display: none !important; }
            .mobile-nav { display: none !important; }
            .app-main-layout {
                max-width: 768px;
                margin-left: 90px;
                padding: 1.5rem 2rem;
            }
        }

        @media (max-width: 767px) {
            .pc-sidebar { display: none !important; }
            .tablet-sidebar { display: none !important; }
            .mobile-nav { display: flex; }
            .app-main-layout {
                max-width: 100%;
                margin-left: 0;
                padding: 1rem;
                padding-bottom: 5rem;
            }
        }
    </style>
</head>
<body class="dark antialiased selection:bg-white selection:text-black min-h-screen">

    <div id="app" class="min-h-screen flex flex-col">
        <main id="main-content" class="w-full min-h-screen flex flex-col">
            <div id="splash-screen" class="flex flex-col items-center justify-center min-h-screen p-6 space-y-6">
                <svg class="w-20 h-20 animate-pulse" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="205" cy="256" r="85" fill="currentColor"/>
                    <circle cx="335" cy="256" r="55" fill="currentColor"/>
                </svg>
                <p class="text-xs font-semibold tracking-widest uppercase opacity-40">spatialetwo</p>
            </div>
        </main>
    </div>

    <!-- System Modal Dialog -->
    <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden p-6">
        <div class="bg-black text-white dark:bg-black dark:text-white p-8 rounded-2xl max-w-sm w-full text-center space-y-6 border border-white/10">
            <p id="modal-message" class="text-xs sm:text-sm font-medium opacity-90 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full py-3 bg-white text-black font-bold text-xs rounded-full active:scale-95">dismiss</button>
        </div>
    </div>

    <!-- Edit Post Modal -->
    <div id="edit-post-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden p-6">
        <div class="bg-black text-white p-6 rounded-2xl max-w-md w-full space-y-4 border border-white/10">
            <h3 class="text-xs font-bold uppercase tracking-wider opacity-60">edit publication</h3>
            <textarea id="edit-post-caption" rows="4" class="w-full p-4 bg-transparent border border-white/20 rounded-xl text-xs sm:text-sm focus:outline-none resize-none text-white"></textarea>
            <div class="flex space-x-3">
                <button onclick="savePostEdit()" class="flex-1 py-3 bg-white text-black font-bold text-xs rounded-full active:scale-95">save</button>
                <button onclick="closeEditModal()" class="flex-1 py-3 border border-white/20 text-white font-bold text-xs rounded-full active:scale-95">cancel</button>
            </div>
        </div>
    </div>

    <!-- Live Camera Modal -->
    <div id="camera-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black hidden p-6">
        <div class="w-full max-w-md flex flex-col items-center space-y-6">
            <div class="relative w-full aspect-square rounded-2xl overflow-hidden border border-white/20">
                <video id="camera-stream" autoplay playsinline class="w-full h-full object-cover"></video>
            </div>
            <div class="flex space-x-4 w-full">
                <button onclick="capturePhoto()" class="flex-1 py-3.5 bg-white text-black font-semibold text-xs rounded-full active:scale-95">capture</button>
                <button onclick="closeCamera()" class="flex-1 py-3.5 border border-white/20 text-white font-semibold text-xs rounded-full active:scale-95">cancel</button>
            </div>
        </div>
        <canvas id="snapshot-canvas" class="hidden"></canvas>
    </div>

    <!-- Followers / Following / Group Creator Modal -->
    <div id="user-list-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden p-6">
        <div class="bg-black text-white p-6 rounded-2xl max-w-md w-full space-y-4 max-h-[85vh] flex flex-col border border-white/10">
            <div class="flex justify-between items-center pb-3 border-b border-white/10">
                <h3 id="user-list-title" class="text-xs font-bold uppercase tracking-wider opacity-60">users</h3>
                <button onclick="closeUserListModal()" class="p-2 opacity-60 text-sm">✕</button>
            </div>
            <div id="user-list-content" class="flex-1 overflow-y-auto space-y-3 pt-2"></div>
        </div>
    </div>

    <!-- Detailed Video Call Modal in DM -->
    <div id="video-call-modal" class="fixed inset-0 z-50 bg-black flex flex-col justify-between hidden p-6 text-white">
        <div class="flex justify-between items-center z-10">
            <div class="flex items-center space-x-3 px-4 py-2 border border-white/20 rounded-full">
                <div class="w-2.5 h-2.5 bg-red-500 rounded-full animate-ping"></div>
                <span id="call-target-name" class="text-xs font-bold">secure video channel</span>
            </div>
            <button onclick="toggleCallMute()" id="call-mute-btn" class="px-4 py-2 border border-white/20 rounded-full text-xs font-bold active:scale-95">mute mic</button>
        </div>

        <div class="flex-1 flex items-center justify-center relative my-4 rounded-3xl overflow-hidden border border-white/10">
            <video id="local-video-preview" autoplay playsinline muted class="absolute bottom-6 right-6 w-24 h-36 object-cover rounded-xl border border-white/20 z-20 shadow-2xl"></video>
            <video id="remote-video-stream" autoplay playsinline class="w-full h-full object-cover"></video>
            <div id="call-status-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/70 space-y-3">
                <svg class="w-12 h-12 animate-bounce opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                <p class="text-xs font-medium opacity-80">establishing secure peer connection...</p>
            </div>
        </div>

        <div class="flex space-x-4 items-center justify-center pb-2 z-10">
            <button onclick="endVideoCall()" class="px-8 py-3.5 bg-red-600 text-white font-bold text-xs rounded-full active:scale-95">end call</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'spatialetwo-app';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : JSON.stringify({
            apiKey: "AIzaSyBGpqz8AiNyMg4SHu1ljRd_INI9YAiSsIo",
            authDomain: "spatialetwo.firebaseapp.com",
            projectId: "spatialetwo",
            storageBucket: "spatialetwo.firebasestorage.app",
            messagingSenderId: "194895362000",
            appId: "1:194895362000:web:b2dc1ab1650fa2635aebd5",
            measurementId: "G-7F55107941"
        }));

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let userProfile = null;
        let mediaStream = null;
        let activeTab = 'feed';
        let viewProfileUid = null;
        let activeEditingPostId = null;
        let activeChatUser = null; 
        let callPeerConnection = null;
        let callLocalStream = null;
        let isCallMuted = false;
        let currentTheme = localStorage.getItem('spatialetwo_theme') || 'dark';

        function applyTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('spatialetwo_theme', theme);
            const body = document.body;
            if (theme === 'light') {
                body.classList.remove('dark');
                body.classList.add('light');
            } else {
                body.classList.remove('light');
                body.classList.add('dark');
            }
        }

        window.showModal = function(msg) {
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('custom-modal').classList.remove('hidden');
        }
        window.closeModal = function() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function isVerified(profile) {
            return profile && profile.followers && profile.followers.length >= 100;
        }

        function getVerifyBadge(profile) {
            if (isVerified(profile)) {
                return `<span class="inline-flex items-center justify-center w-3.5 h-3.5 ml-1.5 bg-verifyYellow text-black font-black text-[8px] rounded-full" title="Verified Creator (100+ Followers)">✓</span>`;
            }
            return '';
        }

        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission().catch(() => {});
            }
        }

        function sendDeviceNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    new Notification(title, { body: body });
                } catch(e) {}
            }
        }

        function getStoredAccounts() {
            try {
                return JSON.parse(localStorage.getItem('spatialetwo_local_accounts') || '{}');
            } catch(e) {
                return {};
            }
        }

        function saveLocalAccount(userData) {
            const accs = getStoredAccounts();
            accs[userData.username.toLowerCase()] = userData;
            localStorage.setItem('spatialetwo_local_accounts', JSON.stringify(accs));
            localStorage.setItem('spatialetwo_logged_username', userData.username.toLowerCase());
        }

        async function initAuth() {
            applyTheme(currentTheme);
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                try { await signInAnonymously(auth); } catch(e) {}
            }

            onAuthStateChanged(auth, async (user) => {
                currentUser = user;
                requestNotificationPermission();
                await restoreUserSession();
            });
        }

        async function restoreUserSession() {
            const savedUsername = localStorage.getItem('spatialetwo_logged_username');
            if (savedUsername) {
                let found = await loadProfileByUsername(savedUsername);
                if (!found) {
                    const localAccs = getStoredAccounts();
                    if (localAccs[savedUsername]) {
                        userProfile = localAccs[savedUsername];
                        found = true;
                    }
                }
                if (found && userProfile) {
                    renderMainApp();
                    return;
                }
            }

            if (currentUser) {
                try {
                    const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.uid);
                    const userSnap = await getDoc(userDocRef);
                    if (userSnap.exists()) {
                        userProfile = userSnap.data();
                        saveLocalAccount(userProfile);
                        renderMainApp();
                        return;
                    }
                } catch (e) {}
            }

            renderAuthScreen();
        }

        async function loadProfileByUsername(username) {
            try {
                const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
                let matched = null;
                usersSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data && data.username && data.username.toLowerCase() === username.toLowerCase()) {
                        matched = data;
                    }
                });
                if (matched) {
                    userProfile = matched;
                    return true;
                }
            } catch(e) {}
            return false;
        }

        function renderAuthScreen() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen p-6 space-y-8">
                    <div class="flex flex-col items-center space-y-3 text-center">
                        <svg class="w-16 h-16" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="205" cy="256" r="85" fill="currentColor"/>
                            <circle cx="335" cy="256" r="55" fill="currentColor"/>
                        </svg>
                        <h1 class="text-2xl font-black tracking-tight">spatialetwo</h1>
                        <p class="text-[11px] opacity-40 uppercase tracking-widest">minimal network</p>
                    </div>

                    <div class="w-full max-w-xs space-y-6">
                        <div class="flex border-b border-white/20 pb-2 justify-center space-x-8 text-xs font-bold">
                            <button id="tab-login" onclick="switchAuthTab('login')" class="opacity-100 pb-1 border-b-2 border-white">login</button>
                            <button id="tab-signup" onclick="switchAuthTab('signup')" class="opacity-40 pb-1">create account</button>
                        </div>

                        <div id="auth-form-container" class="space-y-4"></div>
                    </div>
                </div>
            `;
            switchAuthTab('login');
        }

        window.switchAuthTab = function(mode) {
            const container = document.getElementById('auth-form-container');
            const loginBtn = document.getElementById('tab-login');
            const signupBtn = document.getElementById('tab-signup');

            if (mode === 'login') {
                loginBtn.className = "opacity-100 pb-1 border-b-2 border-white font-bold";
                signupBtn.className = "opacity-40 pb-1 font-bold";
                
                const localAccs = getStoredAccounts();
                const accountUsernames = Object.keys(localAccs);

                container.innerHTML = `
                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <input type="text" id="login-username" placeholder="username" required 
                            class="w-full px-4 py-3 bg-transparent border border-white/20 rounded-xl text-xs focus:outline-none">
                        <input type="password" id="login-password" placeholder="password" required 
                            class="w-full px-4 py-3 bg-transparent border border-white/20 rounded-xl text-xs focus:outline-none">
                        <button type="submit" class="w-full py-3.5 bg-white text-black font-bold text-xs rounded-full active:scale-95">enter</button>
                    </form>

                    ${accountUsernames.length > 0 ? `
                        <div class="pt-6 space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-[10px] uppercase font-bold opacity-40 tracking-wider">recent accounts</span>
                                <button type="button" onclick="clearRecentAccounts()" class="text-[10px] opacity-40 hover:opacity-100 underline">clear</button>
                            </div>
                            <div class="space-y-2 max-h-40 overflow-y-auto">
                                ${accountUsernames.map(uname => {
                                    const acc = localAccs[uname];
                                    return `
                                        <div onclick="quickSelectAccount('${acc.username}', '${acc.password}')" class="p-3 border border-white/10 rounded-xl flex items-center justify-between cursor-pointer active:scale-98">
                                            <div class="flex items-center space-x-3">
                                                <div class="w-7 h-7 rounded-full border border-white/20 overflow-hidden flex items-center justify-center">
                                                    ${acc.avatar ? `<img src="${acc.avatar}" class="w-full h-full object-cover">` : `<span class="text-[10px] font-bold">${acc.username[0].toUpperCase()}</span>`}
                                                </div>
                                                <span class="text-xs font-bold">@${acc.username}</span>
                                            </div>
                                            <span class="text-[10px] opacity-40">select</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    ` : ''}
                `;
            } else {
                signupBtn.className = "opacity-100 pb-1 border-b-2 border-white font-bold";
                loginBtn.className = "opacity-40 pb-1 font-bold";
                container.innerHTML = `
                    <form onsubmit="handleSignup(event)" class="space-y-4">
                        <input type="text" id="su-name" placeholder="full name" required 
                            class="w-full px-4 py-3 bg-transparent border border-white/20 rounded-xl text-xs focus:outline-none">
                        <input type="text" id="su-username" placeholder="username (unique)" required 
                            class="w-full px-4 py-3 bg-transparent border border-white/20 rounded-xl text-xs focus:outline-none">
                        <input type="password" id="su-password" placeholder="password" required 
                            class="w-full px-4 py-3 bg-transparent border border-white/20 rounded-xl text-xs focus:outline-none">
                        
                        <div class="space-y-2 pt-2">
                            <div class="flex justify-between text-xs font-semibold opacity-60">
                                <span>age</span>
                                <span id="age-display" class="font-bold">22 yrs</span>
                            </div>
                            <input type="range" id="su-age-slider" min="14" max="90" value="22" oninput="updateAgeDisplay(this.value)">
                        </div>

                        <div class="space-y-2 pt-2">
                            <div class="flex justify-between text-xs font-semibold opacity-60">
                                <span>gender orientation</span>
                                <span id="gender-display" class="font-bold">non-binary</span>
                            </div>
                            <input type="range" id="su-gender-slider" min="0" max="3" value="0" step="1" oninput="updateGenderDisplay(this.value)">
                        </div>

                        <textarea id="su-bio" placeholder="short bio..." rows="2" 
                            class="w-full px-4 py-3 bg-transparent border border-white/20 rounded-xl text-xs focus:outline-none resize-none"></textarea>
                        
                        <div class="flex items-center space-x-3 pt-2">
                            <div id="avatar-preview" class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center overflow-hidden flex-shrink-0">
                                <svg class="w-4 h-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            </div>
                            <div class="flex space-x-2 flex-1">
                                <label class="flex-1 text-xs font-semibold opacity-80 border border-white/20 py-2.5 rounded-full text-center cursor-pointer active:scale-95">
                                    avatar
                                    <input type="file" id="su-avatar-file" accept="image/*" onchange="handleAvatarUpload(event)" class="hidden">
                                </label>
                                <button type="button" onclick="openCameraModal()" class="flex-1 text-xs font-semibold opacity-80 border border-white/20 py-2.5 rounded-full active:scale-95">
                                    camera
                                </button>
                            </div>
                        </div>

                        <div class="flex items-start space-x-3 pt-2">
                            <input type="checkbox" id="terms-check" required class="mt-0.5 w-3.5 h-3.5 rounded bg-transparent border border-white/40">
                            <label for="terms-check" class="text-[10px] opacity-60 leading-snug">
                                I confirm I am 14+ years of age and agree to content rules.
                            </label>
                        </div>

                        <button type="submit" class="w-full py-3.5 bg-white text-black font-bold text-xs rounded-full active:scale-95">create account</button>
                    </form>
                `;
            }
        }

        window.quickSelectAccount = function(username, password) {
            document.getElementById('login-username').value = username;
            document.getElementById('login-password').value = password;
        }

        window.clearRecentAccounts = function() {
            localStorage.removeItem('spatialetwo_local_accounts');
            switchAuthTab('login');
        }

        const GENDER_MAP = ["non-binary", "female", "male", "custom"];
        window.updateAgeDisplay = function(val) {
            document.getElementById('age-display').innerText = val + " yrs";
        }
        window.updateGenderDisplay = function(val) {
            document.getElementById('gender-display').innerText = GENDER_MAP[val];
        }

        let pendingAvatarBase64 = null;
        window.handleAvatarUpload = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    pendingAvatarBase64 = e.target.result;
                    const preview = document.getElementById('avatar-preview');
                    if (preview) preview.innerHTML = `<img src="${pendingAvatarBase64}" class="w-full h-full object-cover">`;
                };
                reader.readAsDataURL(file);
            }
        }

        window.openCameraModal = function() {
            const modal = document.getElementById('camera-modal');
            modal.classList.remove('hidden');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                .then(stream => {
                    mediaStream = stream;
                    document.getElementById('camera-stream').srcObject = stream;
                })
                .catch(() => {
                    showModal("Camera access unavailable.");
                    modal.classList.add('hidden');
                });
        }

        window.closeCamera = function() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('camera-modal').classList.add('hidden');
        }

        window.capturePhoto = function() {
            const video = document.getElementById('camera-stream');
            const canvas = document.getElementById('snapshot-canvas');
            canvas.width = video.videoWidth || 300;
            canvas.height = video.videoHeight || 300;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            pendingAvatarBase64 = canvas.toDataURL('image/png');
            const preview = document.getElementById('avatar-preview');
            if (preview) preview.innerHTML = `<img src="${pendingAvatarBase64}" class="w-full h-full object-cover">`;
            closeCamera();
        }

        window.handleSignup = async function(event) {
            event.preventDefault();
            const name = document.getElementById('su-name').value.trim();
            const username = document.getElementById('su-username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
            const password = document.getElementById('su-password').value;
            const age = parseInt(document.getElementById('su-age-slider').value, 10);
            const genderIndex = document.getElementById('su-gender-slider').value;
            const gender = GENDER_MAP[genderIndex];
            const bio = document.getElementById('su-bio').value.trim();
            const termsChecked = document.getElementById('terms-check').checked;

            if (age < 14) {
                showModal("Users below 14 years of age are not permitted.");
                return;
            }

            if (!termsChecked) {
                showModal("Please agree to the age requirement and content guidelines.");
                return;
            }

            if (!username) {
                showModal("Please enter a valid username.");
                return;
            }

            let activeUid = currentUser ? currentUser.uid : 'usr_' + Date.now();
            if (!currentUser) {
                try {
                    const cred = await signInAnonymously(auth);
                    activeUid = cred.user.uid;
                } catch(e) {}
            }

            let usernameTaken = false;
            try {
                const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
                usersSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data && data.username === username) {
                        usernameTaken = true;
                    }
                });
            } catch(e) {}

            if (usernameTaken) {
                showModal(`@${username} is already taken. Please choose another username.`);
                return;
            }

            const newUser = {
                uid: activeUid,
                name,
                username,
                password,
                age,
                gender,
                bio,
                avatar: pendingAvatarBase64 || '',
                banner: '',
                followers: [],
                following: [],
                createdAt: Date.now()
            };

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', activeUid), newUser);
            } catch(e) {}

            userProfile = newUser;
            saveLocalAccount(newUser);
            renderMainApp();
        }

        window.handleLogin = async function(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            const localAccs = getStoredAccounts();
            if (localAccs[username] && localAccs[username].password === password) {
                userProfile = localAccs[username];
                localStorage.setItem('spatialetwo_logged_username', username);
                renderMainApp();
                return;
            }

            try {
                const usersSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
                let matchedUser = null;
                usersSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.username === username && data.password === password) {
                        matchedUser = data;
                    }
                });

                if (matchedUser) {
                    userProfile = matchedUser;
                    saveLocalAccount(matchedUser);
                    renderMainApp();
                } else {
                    showModal("Invalid username or password.");
                }
            } catch (err) {
                showModal("Login failed. Check your network connection.");
            }
        }

        window.switchTab = function(tab) {

            if (!container) return;
            if (tab === 'feed') renderFeedView(container);
            else if (tab === 'search') renderSearchView(container);
            else if (tab === 'compose') renderComposeView(container);
            else if (tab === 'messages') renderMessagesHubView(container);
            else if (tab === 'chat') renderChatView(container);
            else if (tab === 'notifications') renderNotificationsView(container);
            else if (tab === 'settings') renderSettingsView(container);
            else if (tab === 'profile') renderProfileView(container, userProfile.uid);
            else if (tab === 'user-profile') renderProfileView(container, viewProfileUid);

        function fetchChatsHub() {
            const chatsRef = collection(db, 'artifacts', appId, 'public', 'data', 'chats');
            onSnapshot(chatsRef, (snapshot) => {
                const conversations = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.members && data.members.includes(userProfile.uid)) {
                        conversations.push({ id: docSnap.id, ...data });
                    }
                });
                conversations.sort((a,b) => (b.lastActivity || 0) - (a.lastActivity || 0));

                const listEl = document.getElementById('chats-hub-list');
                if (!listEl) return;

                if (conversations.length === 0) {
                    listEl.innerHTML = `<div class="text-center py-12 opacity-40 text-xs">no active conversations yet.</div>`;
                    return;
                }

                listEl.innerHTML = conversations.map(chat => {
                    const isGroup = chat.isGroup;
                    const displayName = isGroup ? chat.groupName : chat.otherUsername;
                    const displayAvatar = isGroup ? chat.groupAvatar : chat.otherAvatar;

                    return `
                        <div onclick="openChatRoom('${chat.id}', ${isGroup}, '${displayName}', '${displayAvatar || ''}', '${chat.otherUid || ''}')" 
                            class="flex items-center justify-between py-3 border-b border-white/10 cursor-pointer active:opacity-60">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-full border border-white/20 overflow-hidden flex items-center justify-center flex-shrink-0">

                                </div>

                                    <span class="text-xs font-bold flex items-center">
                                        ${isGroup ? '' : '@'}${displayName}
                                        ${isGroup ? '<span class="ml-2 text-[9px] opacity-50 font-normal">group</span>' : ''}
                                    </span>
                                    <p class="text-[11px] opacity-50 truncate max-w-[200px]">${chat.lastMessage || 'tap to view'}</p>
                                </div>
                            </div>
                            <span class="text-[10px] opacity-40">${chat.lastActivity ? new Date(chat.lastActivity).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}</span>
                        </div>
                    `;
                }).join('');
            });
        }

        window.openDirectMessage = async function(targetUid, targetUsername, targetAvatar) {
            if (targetUid === userProfile.uid) return;
            const chatsRef = collection(db, 'artifacts', appId, 'public', 'data', 'chats');
            const chatsSnap = await getDocs(chatsRef);
            
            let existingChatId = null;
            chatsSnap.forEach(d => {
                const data = d.data();
                if (!data.isGroup && data.members && data.members.includes(userProfile.uid) && data.members.includes(targetUid)) {
                    existingChatId = d.id;
                }
            });

            if (!existingChatId) {
                const newChatRef = doc(chatsRef);
                existingChatId = newChatRef.id;
                await setDoc(newChatRef, {
                    isGroup: false,
                    members: [userProfile.uid, targetUid],
                    otherUid: targetUid,
                    otherUsername: targetUsername,
                    otherAvatar: targetAvatar,
                    lastMessage: 'conversation initialized',
                    lastActivity: Date.now()
                });
            }

            openChatRoom(existingChatId, false, targetUsername, targetAvatar, targetUid);
        }

            switchTab('chat');

        function fetchChatMessages() {
            if (!activeChatUser) return;
            const msgsRef = collection(db, 'artifacts', appId, 'public', 'data', 'chats', activeChatUser.chatId, 'messages');
            onSnapshot(msgsRef, (snapshot) => {
                const msgs = [];
                snapshot.forEach(docSnap => {
                    msgs.push({ id: docSnap.id, ...docSnap.data() });
                });
                msgs.sort((a,b) => a.createdAt - b.createdAt);

                const container = document.getElementById('chat-messages-container');
                if (!container) return;

                if (msgs.length === 0) {
                    container.innerHTML = `<div class="text-center py-12 opacity-40 text-xs">no messages yet</div>`;
                    return;

                container.innerHTML = msgs.map(m => {
                    const isMe = m.senderUid === userProfile.uid;
                    return `

        window.handleChatKeyDown = function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendChatMessage();
            }
        }

        window.sendChatMessage = async function() {
            const input = document.getElementById('chat-msg-input');
            const text = input.value.trim();
            if (!text || !activeChatUser) return;

            const msgRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'chats', activeChatUser.chatId, 'messages'));
            await setDoc(msgRef, {
                senderUid: userProfile.uid,
                senderUsername: userProfile.username,
                text,
                createdAt: Date.now()
            });

            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chats', activeChatUser.chatId), {
                lastMessage: `@${userProfile.username}: ${text}`,
                lastActivity: Date.now()

            const modal = document.getElementById('video-call-modal');
            document.getElementById('call-target-name').innerText = activeChatUser.name;
            modal.classList.remove('hidden');

            try {
                callLocalStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video-preview').srcObject = callLocalStream;

                callPeerConnection = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                callLocalStream.getTracks().forEach(track => callPeerConnection.addTrack(track, callLocalStream));

                callPeerConnection.ontrack = (event) => {
                    document.getElementById('remote-video-stream').srcObject = event.streams[0];
                    document.getElementById('call-status-overlay').classList.add('hidden');
                };

                setTimeout(() => {
                    document.getElementById('remote-video-stream').srcObject = callLocalStream;
                    document.getElementById('call-status-overlay').classList.add('hidden');
                }, 1500);

            } catch(e) {
                showModal("Camera or microphone access denied/unavailable.");
                modal.classList.add('hidden');
            }
        }

                if (audioTrack) {

                    isCallMuted = !audioTrack.enabled;
                    document.getElementById('call-mute-btn').innerText = isCallMuted ? 'unmute' : 'mute';
                }
            }
        }

        window.endVideoCall = function() {
            if (callLocalStream) {
                callLocalStream.getTracks().forEach(t => t.stop());
            }
            if (callPeerConnection) {
                callPeerConnection.close();

            document.getElementById('video-call-modal').classList.add('hidden');

            const followingList = [];
            usersSnap.forEach(d => {
                if (followingUids.includes(d.data().uid)) followingList.push(d.data());
            });

            content.innerHTML = followingList.map(u => `
                <div onclick="closeUserListModal(); viewUserProfile('${u.uid}')" class="flex items-center justify-between py-2 border-b border-white/10 cursor-pointer">
                    <div class="flex items-center space-x-3">
                        <div class="w-7 h-7 rounded-full border border-white/20 overflow-hidden flex items-center justify-center">
                            ${u.avatar ? `<img src="${u.avatar}" class="w-full h-full object-cover">` : `<span class="text-[10px] font-bold">${u.username[0].toUpperCase()}</span>`}
                        </div>
                        <span class="text-xs font-bold flex items-center">@${u.username} ${getVerifyBadge(u)}</span>
                    </div>
                </div>
            `).join('');
        }

        window.closeUserListModal = function() {
            document.getElementById('user-list-modal').classList.add('hidden');
        }

        function renderComposeView(container) {
            container.innerHTML = `
                <div class="flex flex-col space-y-6">
                    <div class="flex items-center space-x-3 border-b border-white/10 pb-4">
                        <button onclick="switchTab('feed')" class="text-xs underline">← back</button>
                        <h2 class="text-sm font-black tracking-tight">compose frequency</h2>
                    </div>

                    <textarea id="post-caption" 
                        placeholder="what's happening? use #hashtags and @mentions..." rows="4" 
                        class="w-full p-4 bg-transparent border border-white/20 rounded-2xl text-xs sm:text-sm focus:outline-none resize-none"></textarea>
                    
                    <div class="flex items-center space-x-3">
                        <label class="flex-1 text-center text-xs font-semibold py-2.5 border border-white/20 rounded-full cursor-pointer active:scale-95">
                            media
                            <input type="file" id="post-media-file" accept="image/*,video/*" onchange="handlePostMediaUpload(event)" class="hidden">
                        </label>
                        <button type="button" onclick="openCameraModal()" class="flex-1 text-xs font-semibold py-2.5 border border-white/20 rounded-full active:scale-95">
                            camera
                        </button>
                    </div>

                    <div id="compose-preview" class="w-full hidden aspect-square rounded-2xl overflow-hidden border border-white/20 relative">
                        <img id="compose-preview-img" class="w-full h-full object-cover hidden">
                        <video id="compose-preview-vid" controls class="w-full h-full object-cover hidden"></video>
                        <button onclick="removeComposeMedia()" class="absolute top-3 right-3 px-3 py-1 bg-black/80 text-white text-[10px] rounded-full">remove</button>
                    </div>

                    <button onclick="publishPost()" class="w-full py-3.5 bg-white text-black font-bold text-xs rounded-full active:scale-95">publish</button>
                </div>
            `;
        }

        let composeMediaBase64 = null;
        let isVideoMedia = false;

        window.handlePostMediaUpload = function(event) {
            const file = event.target.files[0];
            if (file) {
                isVideoMedia = file.type.startsWith('video');
                const reader = new FileReader();
                reader.onload = function(e) {
                    composeMediaBase64 = e.target.result;
                    const preview = document.getElementById('compose-preview');
                    const img = document.getElementById('compose-preview-img');
                    const vid = document.getElementById('compose-preview-vid');

                    if (isVideoMedia) {
                        img.classList.add('hidden');
                        vid.src = composeMediaBase64;
                        vid.classList.remove('hidden');
                    } else {
                        vid.classList.add('hidden');
                        img.src = composeMediaBase64;
                        img.classList.remove('hidden');
                    }
                    if (preview) preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        window.removeComposeMedia = function() {
            composeMediaBase64 = null;
            isVideoMedia = false;
            const preview = document.getElementById('compose-preview');
            if (preview) preview.classList.add('hidden');
        }

        window.publishPost = async function() {
            const caption = document.getElementById('post-caption').value.trim();
            if (!caption && !composeMediaBase64) {
                showModal("Please add text or media to publish.");
                return;
            }

            try {
                const newPost = {
                    authorUid: userProfile.uid,
                    authorUsername: userProfile.username,
                    authorAvatar: userProfile.avatar || '',
                    authorFollowers: userProfile.followers || [],
                    caption,
                    media: composeMediaBase64 || '',
                    isVideo: isVideoMedia,
                    ratio: '1/1',
                    likes: [],
                    comments: [],
                    createdAt: Date.now()
                };

                await setDoc(doc(collection(db, 'artifacts', appId, 'public', 'data', 'posts')), newPost);
                composeMediaBase64 = null;
                isVideoMedia = false;
                switchTab('feed');
            } catch (e) {
                showModal("Error publishing publication.");
            }
        }

        window.toggleLike = async function(postId, authorUid) {
            const postRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', postId);
            const postSnap = await getDoc(postRef);
            if (!postSnap.exists()) return;
            const data = postSnap.data();
            let likes = data.likes || [];

            if (likes.includes(userProfile.uid)) {
                likes = likes.filter(id => id !== userProfile.uid);
            } else {
                likes.push(userProfile.uid);
                if (authorUid !== userProfile.uid) {
                    await addNotification(authorUid, `@${userProfile.username} liked your publication`);
                    sendDeviceNotification("spatialetwo", `@${userProfile.username} liked your post`);
                }
            }
            await updateDoc(postRef, { likes });
        }

        window.addComment = async function(postId, authorUid) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const postRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', postId);
            const postSnap = await getDoc(postRef);
            if (!postSnap.exists()) return;
            const data = postSnap.data();
            const comments = data.comments || [];

            comments.push({
                uid: userProfile.uid,
                username: userProfile.username,
                text,
                createdAt: Date.now()
            });

            await updateDoc(postRef, { comments });
            if (authorUid !== userProfile.uid) {
                await addNotification(authorUid, `@${userProfile.username} commented on your publication`);
                sendDeviceNotification("spatialetwo", `@${userProfile.username} commented on your post`);
            }
            input.value = '';
        }

        window.toggleFollow = async function(targetUid) {
            if (targetUid === userProfile.uid) return;
            const targetRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', targetUid);
            const myRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', userProfile.uid);

            const targetSnap = await getDoc(targetRef);
            const mySnap = await getDoc(myRef);
            if (!targetSnap.exists() || !mySnap.exists()) return;

            const targetData = targetSnap.data();
            const myData = mySnap.data();

            let myFollowing = myData.following || [];
            let targetFollowers = targetData.followers || [];

            if (myFollowing.includes(targetUid)) {
                myFollowing = myFollowing.filter(id => id !== targetUid);
                targetFollowers = targetFollowers.filter(id => id !== userProfile.uid);
            } else {
                myFollowing.push(targetUid);
                targetFollowers.push(userProfile.uid);
                
                await addNotification(targetUid, `@${userProfile.username} started following you`);
                sendDeviceNotification("spatialetwo", `@${userProfile.username} started following you`);
            }

            await updateDoc(myRef, { following: myFollowing });
            await updateDoc(targetRef, { followers: targetFollowers });
            
            userProfile.following = myFollowing;
            saveLocalAccount(userProfile);
            renderMainApp();
        }

        async function addNotification(targetUid, text) {
            const notifRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'notifications'));
            await setDoc(notifRef, {
                targetUid,
                senderUid: userProfile.uid,
                text,
                read: false,
                createdAt: Date.now()
            });
        }

        function listenToNotifications() {
            const notifsRef = collection(db, 'artifacts', appId, 'public', 'data', 'notifications');
            onSnapshot(notifsRef, (snapshot) => {
                let count = 0;
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.targetUid === userProfile.uid && !data.read) {
                        count++;
                    }
                });
                const badge = document.getElementById('notif-badge');
                if (badge) {
                    if (count > 0) badge.classList.remove('hidden');
                    else badge.classList.add('hidden');
                }
            });
        }

        function renderNotificationsView(container) {
            container.innerHTML = `
                <div class="flex flex-col space-y-6">
                    <div class="flex items-center space-x-3 border-b border-white/10 pb-4">
                        <button onclick="switchTab('feed')" class="text-xs underline">← back</button>
                        <h2 class="text-sm font-black tracking-tight">notifications</h2>
                    </div>
                    <div id="notifications-list" class="space-y-3">
                        <div class="text-center py-12 opacity-30 text-xs">loading notifications...</div>
                    </div>
                </div>
            `;
            const notifsRef = collection(db, 'artifacts', appId, 'public', 'data', 'notifications');
            onSnapshot(notifsRef, (snapshot) => {
                const list = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.targetUid === userProfile.uid) {
                        list.push({ id: docSnap.id, ...data });
                    }
                });
                list.sort((a, b) => b.createdAt - a.createdAt);
                const listEl = document.getElementById('notifications-list');
                if (!listEl) return;

                if (list.length === 0) {
                    listEl.innerHTML = `<div class="text-center py-12 opacity-40 text-xs">no notifications yet</div>`;
                    return;
                }

                listEl.innerHTML = list.map(n => `
                    <div onclick="if('${n.senderUid}') viewUserProfile('${n.senderUid}')" class="flex items-center justify-between py-3 border-b border-white/10 cursor-pointer">
                        <p class="text-xs opacity-90">${n.text}</p>
                        <span class="text-[10px] opacity-40">${new Date(n.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                `).join('');
            });
        }

        window.formatPostContent = function(text) {
            if (!text) return '';
            return text.replace(/(#\w+|@\w+)/g, '<span class="font-bold">$1</span>');
        }

        window.openEditModal = function(id, currentCaption) {
            activeEditingPostId = id;
            document.getElementById('edit-post-caption').value = currentCaption;
            document.getElementById('edit-post-modal').classList.remove('hidden');
        }

        window.closeEditModal = function() {
            document.getElementById('edit-post-modal').classList.add('hidden');
            activeEditingPostId = null;
        }

        window.savePostEdit = async function() {
            if (!activeEditingPostId) return;
            const newCaption = document.getElementById('edit-post-caption').value.trim();
            const postRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', activeEditingPostId);
            await updateDoc(postRef, { caption: newCaption });
            closeEditModal();
            showModal("Publication updated.");
        }

        window.deletePost = async function(id) {
            try {
                const postRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', id);
                await deleteDoc(postRef);
                showModal("Publication removed.");
            } catch(e) {}
        }

        window.toggleComments = function(postId) {
            const el = document.getElementById(`comments-section-${postId}`);
            if (el) el.classList.toggle('hidden');
        }

        window.handleCommentKeyDown = function(event, postId, authorUid) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                addComment(postId, authorUid);
            }
        }

        window.onload = function() {
            initAuth();
        }
    </script>
</body>
</html>
